<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GitHub Live Logs | BG Automation</title><link rel="stylesheet" href="app.css">
<style>
.logs-wrap{display:grid;gap:12px;min-width:0}
.log-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.log-toolbar input,.log-toolbar select{min-width:0;flex:1;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit}
.repo-card{border:1px solid var(--bd);border-radius:12px;background:linear-gradient(160deg,rgba(13,24,48,.96),rgba(10,18,36,.96));padding:13px;min-width:0}
.repo-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.repo-name{font-weight:700;font-size:.9rem;overflow-wrap:anywhere}
.repo-link{font-size:.72rem;color:var(--ac2);white-space:nowrap}
.repo-count{font-size:.7rem;color:var(--mu);white-space:nowrap}
.log-line{display:grid;grid-template-columns:54px minmax(0,1fr) auto;align-items:start;gap:8px;padding:8px 2px;border-top:1px solid rgba(60,110,200,.12);font-size:.8rem}
.log-time{font-variant-numeric:tabular-nums;color:var(--mu);white-space:nowrap;padding-top:1px}
.log-message{min-width:0;overflow-wrap:anywhere}
.log-status{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.7rem;font-weight:800;white-space:nowrap}
.log-status.success{color:#22c55e}.log-status.failure{color:#ef4444}.log-status.cancelled{color:#a1a1aa}.log-status.in_progress,.log-status.queued{color:#f59e0b}.log-status.other{color:#8ba3c7}
.log-open{font-size:.68rem;color:var(--ac2);white-space:nowrap}
.log-empty{padding:9px 2px;color:var(--mu);font-size:.78rem}
@media(max-width:560px){.repo-card{padding:10px}.log-line{grid-template-columns:46px minmax(0,1fr);gap:6px}.log-status{grid-column:2;grid-row:2}.log-open{grid-column:2;grid-row:3}.repo-head{align-items:flex-start}.repo-name{font-size:.82rem}}
</style></head><body><script src="app.js?v=20261008"></script><script>
let STATUS='all',SEARCH='';
const statusLabel=s=>({success:'SUCCESS',failure:'FAILURE',cancelled:'CANCELLED',in_progress:'IN_PROGRESS',queued:'QUEUED'}[s]||String(s||'UNKNOWN').toUpperCase());
const logTime=t=>t?new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false}):'--:--';
function renderLogs(d){
 const bots=Array.isArray(d.bots)?d.bots:[];
 const normalized=bots.map((b,i)=>({...b,_repo:String(b.repo||b.name||('Repository '+(i+1))).trim()}));
 const filtered=normalized.map(b=>({...b,_runs:(Array.isArray(b.runs)?b.runs:[]).filter(r=>{
   const s=String(r.s||'unknown').toLowerCase();
   const ok=STATUS==='all'||(STATUS==='running'?['in_progress','queued'].includes(s):s===STATUS);
   const q=(b.name+' '+b._repo+' '+(r.n||'')+' '+s).toLowerCase();
   return ok&&q.includes(SEARCH.toLowerCase());
 }).sort((a,b)=>new Date(b.t||b.created||0)-new Date(a.t||a.created||0))}))
 .filter(b=>b._runs.length||(!SEARCH&&STATUS==='all'));
 const total=normalized.reduce((n,b)=>n+(b.runs||[]).length,0);
 const shown=filtered.reduce((n,b)=>n+b._runs.length,0);
 const cards=filtered.map(b=>{
  const repo=b._repo;
  const repoUrl='https://github.com/'+repo;
  const rows=b._runs.slice(0,100).map(r=>{
   const s=String(r.s||'unknown').toLowerCase();
   const cls=['success','failure','cancelled','in_progress','queued'].includes(s)?s:'other';
   const label=statusLabel(s);
   const title=r.n||'Workflow run';
   const url=r.u||('https://github.com/'+repo+'/actions');
   return '<div class="log-line"><span class="log-time">'+logTime(r.t||r.created)+'</span><div class="log-message">'+esc(title)+(r.number?' <span class="muted">#'+esc(r.number)+'</span>':'')+'</div><span class="log-status '+cls+'">['+label+']</span><a class="log-open" href="'+esc(url)+'" target="_blank" rel="noopener">Open ↗</a></div>';
  }).join('');
  return '<section class="repo-card"><div class="repo-head"><div class="repo-name">🐙 '+esc(b.name||repo)+'</div><div><span class="repo-count">'+b._runs.length+' logs</span> · <a class="repo-link" href="'+esc(repoUrl)+'/actions" target="_blank" rel="noopener">All runs ↗</a></div></div>'+(rows||'<div class="log-empty">इस रिपॉजिटरी में चुने गए स्टेटस का कोई लॉग उपलब्ध नहीं है।</div>')+'</section>';
 }).join('');
 $('#main').innerHTML='<section class="card"><div class="hd"><h2>📋 GitHub Actions Logs</h2><button class="btn g" id="refreshBtn" onclick="window.refreshDashboard&&window.refreshDashboard()">↻ Refresh</button></div><div class="muted">सभी डैशबोर्ड में जुड़े repositories के उपलब्ध GitHub Actions runs · समय स्थानीय (24-hour) · हर लॉग से GitHub run खोलें।</div><div class="log-toolbar"><input id="logSearch" placeholder="Repository या workflow खोजें…" value="'+esc(SEARCH)+'"><select id="logFilter"><option value="all">सभी स्टेटस</option><option value="success">SUCCESS</option><option value="failure">FAILURE</option><option value="cancelled">CANCELLED</option><option value="running">IN_PROGRESS / QUEUED</option></select></div><div class="muted">'+filtered.length+' repositories · '+shown+' matching logs / '+total+' loaded logs</div></section><div class="logs-wrap">'+(cards||'<section class="repo-card"><div class="log-empty">कोई matching log नहीं मिला।</div></section>')+'</div>';
 const input=$('#logSearch'),select=$('#logFilter');select.value=STATUS;
 input.addEventListener('input',e=>{SEARCH=e.target.value;STATUS=select.value;window.refreshDashboard?.()});
 select.addEventListener('change',e=>{STATUS=e.target.value;SEARCH=input.value;window.refreshDashboard?.()});
}
boot('logs.html','GitHub Live Logs',renderLogs);
</script></body></html>
