import os, random

def load_keys(prefix, max_n=10):
    """GH_PAT_1, GH_PAT_2 ... जैसे सारे नाम पढ़कर खाली वाले छोड़ देता है।"""
    keys = []
    for i in range(1, max_n + 1):
        v = os.environ.get(f"{prefix}_{i}", "").strip()
        if v:
            keys.append(v)
    return keys

YT_KEYS = load_keys("YT_API_KEY")
GH_PATS = load_keys("GH_PAT")
TG_TOKENS = load_keys("TELEGRAM_BOT_TOKEN")

def call_with_rotation(keys, func):
    """हर key बारी-बारी आज़माता है; quota खत्म या error पर अगली key।"""
    order = keys[:]
    random.shuffle(order)
    last_error = None
    for key in order:
        try:
            return func(key)
        except Exception as e:
            last_error = e
    raise last_error
