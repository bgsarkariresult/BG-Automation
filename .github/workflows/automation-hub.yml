name: BG Automation Hub

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target repository (owner/repo)"
        required: true
        type: string
      workflow:
        description: "Workflow file name (for example news-bot.yml)"
        required: true
        type: string
      ref:
        description: "Target branch"
        required: false
        default: "main"
        type: string
      news_urls:
        description: "News URL(s) — only for News Blog Auto Publisher"
        required: false
        type: string
      article_url:
        description: "Article URL — only for SG News18"
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and dispatch target workflow
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          WORKFLOW: ${{ inputs.workflow }}
          REF: ${{ inputs.ref }}
          NEWS_URLS: ${{ inputs.news_urls }}
          ARTICLE_URL: ${{ inputs.article_url }}
          GH_PAT_BGSARKARI: ${{ secrets.GH_PAT_BGSARKARI }}
          GH_PAT_BGTECHLAB: ${{ secrets.GH_PAT_BGTECHLAB }}
        shell: bash
        run: |
          set -euo pipefail

          echo "🔎 Target repo: $TARGET_REPO"
          echo "🔎 Workflow: $WORKFLOW"
          echo "🔎 Ref: $REF"

          if [[ "$TARGET_REPO" != */* ]]; then
            echo "❌ Target repository must be in owner/repo format."
            exit 1
          fi

          OWNER="${TARGET_REPO%%/*}"

          case "$OWNER" in
            bgsarkariresult)
              TOKEN="${GH_PAT_BGSARKARI:-}"
              ;;
            bgtechlab)
              TOKEN="${GH_PAT_BGTECHLAB:-}"
              ;;
            *)
              echo "❌ Unsupported repository owner: $OWNER"
              exit 1
              ;;
          esac

          if [[ -z "$TOKEN" ]]; then
            echo "❌ GitHub PAT secret is missing for owner: $OWNER"
            exit 1
          fi

          WORKFLOW_API="https://api.github.com/repos/$TARGET_REPO/actions/workflows/$WORKFLOW"
          DISPATCH_API="$WORKFLOW_API/dispatches"

          echo "📡 Checking target workflow..."

          CHECK_CODE=$(curl -sS -o workflow-check.json -w "%{http_code}"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "$WORKFLOW_API")

          if [[ "$CHECK_CODE" != "200" ]]; then
            echo "❌ Workflow verification failed (HTTP $CHECK_CODE)"
            cat workflow-check.json
            exit 1
          fi

          echo "✅ Target workflow found."

          python - <<'PY' > payload.json
          import json, os

          payload = {"ref": os.environ["REF"]}
          inputs = {}

          news_urls = os.environ.get("NEWS_URLS", "").strip()
          article_url = os.environ.get("ARTICLE_URL", "").strip()

          if news_urls:
              inputs["news_urls"] = news_urls
          if article_url:
              inputs["article_url"] = article_url

          if inputs:
              payload["inputs"] = inputs

          print(json.dumps(payload))
          PY

          echo "📦 Dispatch payload:"
          cat payload.json

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}"             -X POST "$DISPATCH_API"             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             -H "Content-Type: application/json"             --data-binary @payload.json)

          if [[ "$HTTP_CODE" != "204" ]]; then
            echo "❌ GitHub dispatch failed (HTTP $HTTP_CODE)"
            cat response.json
            exit 1
          fi

          echo "✅ Workflow dispatched successfully!"
          echo "📦 Repository: $TARGET_REPO"
          echo "⚙️ Workflow: $WORKFLOW"
          echo "🌿 Ref: $REF"
