name: BG Title Updater

on:
  schedule:
    - cron: "17 * * * *"   # हर घंटे Telegram बटन; scan दिन में एक बार
  workflow_dispatch:
    inputs:
      action:
        description: "auto / scan / report / decide"
        required: false
        default: "auto"
        type: string
      decisions:
        description: "decide के लिए, जैसे approve:p3:1,reject:p4,undo:p1"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: title-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: Git identity
        run: |
          git config user.name "title-updater-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Run updater
        run: python title_updater/bot.py
        env:
          PERSIST_GIT: "1"
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          ACTION: ${{ inputs.action }}
          DECISIONS: ${{ inputs.decisions }}
          YT_CLIENT_ID: ${{ secrets.YT_UPDATER_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_UPDATER_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_1: ${{ secrets.YT_REFRESH_TOKEN_1 }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
          YT_REFRESH_TOKEN_4: ${{ secrets.YT_REFRESH_TOKEN_4 }}
          YT_REFRESH_TOKEN_5: ${{ secrets.YT_REFRESH_TOKEN_5 }}
          YT_REFRESH_TOKEN_6: ${{ secrets.YT_REFRESH_TOKEN_6 }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          UPDATER_BOT_TOKEN: ${{ secrets.UPDATER_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
