function safeUrl(u){try{const x=new URL(String(u||''),location.href);return x.protocol==='https:'||x.protocol==='http:'?x.href:'#'}catch(_){return'#'}}
function latestState(b){return String((Array.isArray(b.runs)&&b.runs[0]&&b.runs[0].s)||b.status||'unknown')}
function isFail(b){const s=latestState(b);return FAIL_STATES.includes(s)||!!b.failed&&s!=='success'&&!RUN_STATES.includes(s)}
function stateMeta(s){
 s=String(s||'unknown');
 const m={
  success:{i:'🟢',l:'Success',c:'success'},failure:{i:'🔴',l:'Failed',c:'failure'},
  in_progress:{i:'🔵',l:'Running',c:'running'},queued:{i:'🟡',l:'Queued',c:'running'},
  waiting:{i:'⏸️',l:'Waiting',c:'paused'},pending:{i:'⏸️',l:'Pending',c:'paused'},
  cancelled:{i:'🚫',l:'Cancelled',c:'paused'},skipped:{i:'⏭️',l:'Skipped',c:'paused'},
  timed_out:{i:'⏱️',l:'Timed Out',c:'failure'},action_required:{i:'⚠️',l:'Action Required',c:'paused'},
  requested:{i:'📨',l:'Requested',c:'running'},neutral:{i:'➖',l:'Neutral',c:'paused'},
  stale:{i:'🕰️',l:'Stale',c:'failure'},startup_failure:{i:'💥',l:'Startup Failed',c:'failure'},
  unknown:{i:'?',l:'Unknown',c:'paused'}
 };
 return m[s]||{i:'•',l:s.replace(/_/g,' '),c:'paused'};
}
function stateBadge(s,count){const m=stateMeta(s);return '<span class="badge-s '+m.c+'">'+m.i+' '+(count||0)+' '+m.l+'</span>'}
function failureDetail(b){
 if(!b||!b.failed)return '';
 return [b.failed.job&&('Job: '+b.failed.job),b.failed.step&&('Step: '+b.failed.step),
 b.failed.reason&&String(b.failed.reason).replace(/_/g,' ')].filter(Boolean).join(' · ');
}

/* PIN के लिए छुपा हुआ (password) input — prompt() में PIN साफ़ दिखता था */
function askPin(){
 return new Promise(res=>{
  const o=document.createElement('div');
  o.setAttribute('role','dialog');o.setAttribute('aria-modal','true');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px';
  o.innerHTML='<form style="background:var(--cd);color:var(--tx);border:1px solid var(--bd2);border-radius:14px;padding:18px;width:100%;max-width:320px;display:grid;gap:10px"><b>🔐 PIN डालें</b><input class="lk" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" aria-label="PIN"><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn g" type="button" data-x>रद्द करें</button><button class="btn" type="submit">ठीक है</button></div></form>';
  const f=o.firstChild,i=f.querySelector('input');
  const done=v=>{o.remove();res(v)};
  f.addEventListener('submit',e=>{e.preventDefault();done(i.value.trim()||null)});
  f.querySelector('[data-x]').onclick=()=>done(null);
  o.addEventListener('click',e=>{if(e.target===o)done(null)});
  document.body.appendChild(o);i.focus();
 });
}

 const reelSource=bots.find(x=>lc(x.repo)==='bgsarkariresult/bk-growup-');

  const sgReelSource=bots.find(x=>lc(x.repo)==='bgsarkariresult/sg-news18'&&lc(x.workflow)==='reels-bot.yml');
 const sgReelBot={...(sgReelSource||{}),name:'SG News18 - Reels Maker',repo:'bgsarkariresult/SG-News18',workflow:'reels-bot.yml',input_name:'article_url',control_id:'sg_news18_reels_maker',status:(sgReelSource&&sgReelSource.status)||'unknown',runs:Array.isArray(sgReelSource&&sgReelSource.runs)?sgReelSource.runs:[],site:'https://github.com/bgsarkariresult/SG-News18/actions/workflows/reels-bot.yml'};
 const techGlowReelSource=bots.find(x=>lc(x.repo)==='bgtechlab/bg-reels-bot'&&lc(x.workflow)==='reels-bot.yml');
 const techGlowReelBot={...(techGlowReelSource||{}),name:'TechGlow Reels',repo:'bgtechlab/BG-Reels-Bot',workflow:'reels-bot.yml',input_name:'product_url',control_id:'techglow_reels',status:(techGlowReelSource&&techGlowReelSource.status)||'unknown',runs:Array.isArray(techGlowReelSource&&techGlowReelSource.runs)?techGlowReelSource.runs:[],site:'https://github.com/bgtechlab/BG-Reels-Bot/actions/workflows/reels-bot.yml'};
 const siteBots=SITES.map(w=>{

 });

 const running=bots.filter(b=>RUN_STATES.includes(latestState(b)));
 const fails=bots.filter(isFail);
 const allRuns=bots.flatMap(b=>Array.isArray(b.runs)?b.runs:[]);
 const stateCounts=allRuns.reduce((a,r)=>{const s=String(r.s||'unknown');a[s]=(a[s]||0)+1;return a},{});

 d.live_state==='partial'?'⚠ Live API आंशिक है — '+(d.live_api_errors||0)+' repo पढ़ नहीं पाया, बाकी cached data दिख रहा है।':
 '⚠ Live API उपलब्ध नहीं — dashboard.json का cached data दिख रहा है।';
 const match=b=>(!UI.q||(String(b.name||'')+' '+String(b.repo||'')).toLowerCase().includes(UI.q))&&(UI.f==='all'||(UI.f==='run'&&RUN_STATES.includes(latestState(b)))||(UI.f==='fail'&&isFail(b)));
 const none='<small>इस फ़िल्टर से कोई project नहीं मिला।</small>';
 const otherBots=bots.filter(b=>{const r=lc(b.repo);return !YT_REPOS.includes(r)&&!siteRepos.includes(r)&&!HIDDEN_REPOS.includes(r)});
 $('#main').innerHTML=
 '<div class="card"><div class="hd"><h2>🔑 Worker Proxy</h2><button class="btn g" type="button" id="syncBtn" onclick="runSync()">↻ Sync Dashboard</button></div><small id="patStatus">'+esc(liveNote)+' Origin: bgsarkariresult.github.io</small><small id="syncMsg" style="display:block;margin-top:6px"></small></div>'+
 '<div class="card"><div class="hd"><h2>📊 Automation States</h2><small>लाइव sync डेटा · '+running.length+' चल रहे · '+fails.length+' असफल</small></div><div style="display:flex;flex-wrap:wrap;gap:6px">'+
 (['success','failure','in_progress','queued','waiting','pending','cancelled','skipped','timed_out','action_required','requested','neutral','stale','startup_failure'].filter(s=>stateCounts[s]).map(s=>stateBadge(s,stateCounts[s])).join('')||'<small>अभी कोई run डेटा नहीं मिला।</small>')+
 '</div><small style="display:block;margin-top:8px;color:var(--mu)">सिर्फ़ वही states दिखती हैं जिनके हाल के runs मिले हैं।</small></div>'+
 '<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input class="lk" id="qBox" type="search" value="'+esc(UI.q)+'" oninput="setQuery(this.value)" placeholder="🔍 project खोजें…" aria-label="project खोजें" autocomplete="off" style="flex:1;min-width:150px">'+[['all','सब'],['run','चल रहे'],['fail','असफल']].map(x=>'<button class="btn '+(UI.f===x[0]?'':'g')+'" type="button" aria-pressed="'+(UI.f===x[0])+'" onclick="setFilter(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></div>'+

 '<div class="card"><h2>❌ असफल + Errors</h2>'+(fails.map(b=>{
   const s=slugOf(b);REG[s]=b;const f=b.failed||{},r0=(b.runs&&b.runs[0])||{},u=safeUrl(f.url||r0.u||b.url),noWf=!workflowFor(b);
   const why=(f.job||f.step)?('फ़ेल: '+esc(f.job||'—')+' → '+esc(f.step||'—')):('स्थिति: '+esc(stateMeta(latestState(b)).l));
   return '<div class="li"><span><b>'+esc(b.name)+'</b><br><small>'+why+' • '+ago(f.t||r0.t)+'</small></span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" type="button" onclick="startBot(\''+s+'\',\'rerun\')" '+(noWf||UI.busy[s]?'disabled':'')+'>'+ (UI.busy[s]?'⏳ शुरू हो रहा…':'▶ दोबारा चलाएँ')+'</button>'+(u!=='#'?'<a class="btn g t" href="'+esc(u)+'" target="_blank" rel="noopener">Log</a>':'')+'</div></div>'
 }).join('')||'<small>कोई असफल run नहीं।</small>')+'<small id="rerunMsg" role="status" aria-live="polite" style="display:block;margin-top:6px"></small></div>'+

 linkBox+'<div class="project-actions"><button class="btn g" type="button" onclick="showLiveLogs(\''+s+'\')">📋 Logs</button><button class="btn run-action" type="button" id="btn_'+s+'" onclick="startBot(\''+s+'\',\'run\')" '+(!wf||busy?'disabled':'')+'>'+ (busy?'⏳ शुरू हो रहा…':'▶ Run')+'</button><button class="btn g" type="button" onclick="tg(\''+s+'\')" aria-controls="rs_'+s+'" aria-expanded="'+open+'">↻ Runs</button></div>'+

}

 if(title)title.textContent='— '+(S.title||S.name||'');
 const stEl=document.getElementById('logStatus');if(stEl)stEl.innerHTML='<b>स्थिति</b>'+chip(cur?latestState(cur):'unknown');
 const h=document.getElementById('logHint');if(h)h.textContent=S.hint||'';
 const t=document.getElementById('logTerminal');if(t){const near=t.scrollHeight-t.scrollTop-t.clientHeight<40;t.textContent=S.term||'';if(near)t.scrollTop=t.scrollHeight}
 const steps=document.getElementById('logSteps');if(steps)steps.innerHTML=S.steps||'';
 const msg=document.getElementById('logMsg');if(msg)msg.textContent=S.msg||'';
}
function restoreLogs(){if(!UI.log.repo)return;const p=document.getElementById('liveLogPanel');if(!p)return;p.hidden=false;logSkeleton();paintLogs()}
function showLiveLogs(s){
 const b=REG[s],L=UI.log,p=document.getElementById('liveLogPanel');if(!b||!p)return;
 clearTimeout(L.timer);L.token++;L.repo=b.repo;L.workflow=workflowFor(b);L.state={name:b.name,term:'⏳ GitHub Actions से असली logs लिए जा रहे हैं…',steps:'',msg:'',hint:'GitHub Actions से हर 5 सेकंड में refresh होता है।'};
 p.hidden=false;logSkeleton();paintLogs();p.scrollIntoView({behavior:'smooth',block:'start'});pollLogs();
}
function closeLiveLogs(){const L=UI.log;clearTimeout(L.timer);L.token++;L.repo=null;const p=document.getElementById('liveLogPanel');if(p)p.hidden=true}
async function pollLogs(){
 const L=UI.log;if(!L.repo)return;clearTimeout(L.timer);if(document.hidden){L.timer=setTimeout(pollLogs,5000);return}
 const tok=++L.token;try{
  const data=await callWorker({action:'logs',repo:L.repo,workflow:L.workflow},false,true);if(tok!==L.token||!L.repo)return;
  if(!data.ok)throw new Error(data.error||('HTTP '+(data.status||'error')));
  const lines=Array.isArray(data.lines)?data.lines:[],jobs=Array.isArray(data.jobs)?data.jobs:[];
  L.state.term=lines.length?lines.join('\n'):'⏳ Raw log lines अभी GitHub से नहीं मिलीं। Status हर 5 सेकंड में refresh हो रहा है।';
  L.state.steps=jobs.map(j=>'<div class="li"><b>'+esc(j.name)+'</b>'+chip(j.conclusion||j.status||'queued')+'</div>'+
   (j.steps||[]).map(x=>{const icon=x.conclusion==='success'?'✓':x.conclusion==='failure'?'✕':x.status==='in_progress'?'⏳':'○';return '<div style="margin-left:12px;padding:7px 0;border-bottom:1px solid var(--line)"><div class="li"><span>'+icon+' '+esc(x.number||'')+'. '+esc(x.name)+'</span>'+chip(x.conclusion||x.status||'queued')+'</div></div>'}).join('')).join('');
  L.state.msg=data.message||'';if(data.run)L.state.title=L.state.name+' · #'+data.run.id+' · '+(data.run.conclusion||data.run.status);
  if(data.run&&data.run.status==='completed')L.state.hint='✅ Run पूरा हो गया — auto-refresh बंद। नया run चलाने पर फिर 📋 Logs दबाएँ।';
  paintLogs();if(!(data.run&&data.run.status==='completed'))L.timer=setTimeout(pollLogs,5000);
 }catch(e){L.state.msg='❌ '+e.message;paintLogs();L.timer=setTimeout(pollLogs,7000)}
}

function getPin(){try{return localStorage.getItem('bg_pin')||''}catch(_){return''}}
function savePin(p){try{localStorage.setItem('bg_pin',p)}catch(_){}}
function clearPin(){try{localStorage.removeItem('bg_pin')}catch(_){}}
async function callWorker(payload,retried,silent){
 const body=Object.assign({},payload||{}),pin=getPin();if(pin)body.pin=pin;
 const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let data={};try{data=await res.json()}catch(_){data={ok:false,error:'Invalid response',status:res.status}}
 const pinNeeded=(res.status===401||data.status===401)&&/pin/i.test(String(data.error||''));
 if(pinNeeded){
  clearPin(); /* गलत/पुराना PIN हटाएँ ताकि अटका न रहे */
  if(!retried&&!silent){const p=await askPin();if(p){savePin(p);return callWorker(payload,true,silent)}}
 }
 return data;
}
async function runSync(){
 const m=document.getElementById('syncMsg');if(m)m.textContent='⏳ Sync शुरू हो रहा है…';
 try{const data=await callWorker({repo:'bgsarkariresult/BG-Automation',workflow:'sync.yml',ref:'main'});
  if(data.ok){if(m)m.innerHTML='✅ <b>Sync शुरू हो गया!</b> 30–60 सेकंड में live status अपने-आप update होगा।';setTimeout(()=>window.refreshDashboard&&window.refreshDashboard(true),1500)}
  else if(m)m.textContent='❌ Sync फ़ेल: '+(data.error||data.status||'unknown');
 }catch(e){if(m)m.textContent='❌ Network error: '+e.message}
}
async function startBot(s,mode){
 const b=REG[s];if(!b||UI.busy[s])return;
 const rerun=mode==='rerun';
 const wf=workflowFor(b),input=inputFor(b),btn=document.getElementById('btn_'+s),linkEl=document.getElementById('lk_'+s);
 /* "दोबारा चलाएँ" का संदेश असफल कार्ड में दिखे; Run का संदेश उसी प्रोजेक्ट कार्ड में */
 const say=(v,h)=>setMsg(rerun?'rerunMsg':'hn_'+s,v,h);
 if(!wf){say('❌ इस project का workflow configure नहीं है।');return}
 /* link: बॉक्स > याद रखा गया (सिर्फ़ re-run में) */
 const typed=(linkEl&&linkEl.value||UI.links[s]||'').trim();
 const link=typed||(rerun?(lastLinks()[s]||''):'');
 const bad=input&&link?badUrls(link):[];
 if(bad.length){say('❌ यह लिंक सही नहीं है: '+bad[0].slice(0,80)+' (http:// या https:// से शुरू होना चाहिए)');return}
 const payload={repo:b.repo,workflow:wf,ref:'main'};
 if(input&&link)payload.inputs={[input]:link};
 UI.busy[s]=true;if(btn){btn.disabled=true;btn.textContent='⏳ शुरू हो रहा…'}
 say('⏳ Cloudflare Worker → GitHub Actions…');
 let started=false;
 try{
  const data=await callWorker(payload,false);
  if(data.ok){
   started=true;
   if(input)rememberLink(s,link);
   say('✅ <b>GitHub Actions शुरू हो गया!</b>'+(rerun&&link&&!typed?' (पिछला लिंक दोबारा भेजा गया)':'')+' Worker + Master PAT से run भेजा गया।',true);
   if(btn)btn.textContent='✅ शुरू हो गया';
   setTimeout(()=>window.refreshDashboard&&window.refreshDashboard(),1200);
   setTimeout(()=>window.refreshDashboard&&window.refreshDashboard(),5000);
  }else{
   const code=data.status||'';let msg=data.error||data.message||'unknown';
   if(code===401)msg='PIN गलत है या ज़रूरी है — दोबारा कोशिश करें।';
   if(code===404)msg='Repo/workflow नहीं मिला: '+b.repo+' / '+wf;
   if(code===422)msg='GitHub ने request reject की (422). Required input या workflow configuration check करें।';
   say('❌ Worker error '+code+': '+String(msg).slice(0,260));
  }
 }catch(e){say('❌ Worker network error: '+e.message)}
 finally{
  /* सफल होने पर कुछ सेकंड बटन बंद रखें, ताकि गलती से दोहरा run न बने */
  setTimeout(()=>{delete UI.busy[s];const x=document.getElementById('btn_'+s);if(x){x.disabled=!workflowFor(b);x.textContent='▶ Run'}},started?4000:0);
 }
}
window.startBot=startBot;
window.runSync=runSync;
window.showLiveLogs=showLiveLogs;
window.closeLiveLogs=closeLiveLogs;
window.tg=tg;
window.setFilter=setFilter;
window.setQuery=setQuery;
</script>
