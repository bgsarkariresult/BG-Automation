<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>BG Automation — Control</title><link rel="stylesheet" href="app.css"></head><body><script src="app.js"></script>
<script>
const WORKER_URL = 'https://bg-runf.garhwalbhavesh2002.workers.dev/';

async function runNow(btn) {
  btn.disabled = true;
  btn.textContent = '⏳ Chalu ho raha hai...';
  try {
    const r = await fetch(WORKER_URL, { method: 'POST' });
    const j = await r.json();
    btn.textContent = j.ok ? '✅ Run shuru ho gaya (1-2 min baad refresh karo)' : '❌ ' + (j.error || 'Fail (code ' + j.status + ')');
  } catch (e) {
    btn.textContent = '❌ Network error';
  }
  setTimeout(() => { btn.disabled = false; btn.textContent = '▶ Sync Abhi Chalao'; }, 6000);
}

boot('control.html','Control — Run karo',d=>{
 $('#main').innerHTML=`<div class="card"><h2>🎛 Control</h2><small>Yahan se automation haath se chalao.</small><br><br>
 <button onclick="runNow(this)">▶ Sync Abhi Chalao</button>
 <br><br><small>Sync har 15 minute me apne aap bhi chalta hai. Nateeja Dashboard page par 1-2 minute baad dikhega.</small></div>
 <div class="card"><h2>Kaam ka Link</h2>
 <a href="https://github.com/bgsarkariresult/BG-Automation/actions/workflows/sync.yml" target="_blank">GitHub Actions me logs dekho</a></div>`});
</script></body></html>
