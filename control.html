<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Actions Control</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b5bff">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js?v=20261009"></script>
<script>
const WORKER_URL='https://bg-runf.garhwalbhavesh2002.workers.dev/';
const GH_EDIT_URL='https://github.com/bgsarkariresult/BG-Automation/edit/main/data/dashboard.json';

const BOT_CONFIG={
 'bgsarkariresult/sg-news18':{workflow:'news-bot.yml',input:'article_url'},
 'bgsarkariresult/techglow-india':{workflow:'news_automation.yml',input:'article_url'},
 'bgsarkariresult/bk-growup-':{workflow:'run-job-bot.yml',input:'post_url'},
 'bgtechlab/bg-reels-bot':{workflow:'reels-bot.yml',input:'product_url'},
 'bgtechlab/trending-topic-finder':{workflow:'daily-auto-run.yml',input:null},
 'bgtechlab/history-facts':{workflow:'history-facts-bot.yml',input:null},
 'bgtechlab/job-page-auto-publisher':{workflow:'job-page-publisher.yml',input:'job_url'},
 'bgtechlab/amazon_to_blogger':{workflow:'amazon_to_blogger.yml',input:'urls',multi:true},
 'bgtechlab/news-blog-auto-publisher':{workflow:'news-blog-publisher.yml',input:'news_urls',multi:true}
};
const YT_REPOS=[
 'bgsarkariresult/sg-news18','bgsarkariresult/techglow-india',
 'bgsarkariresult/bk-growup-','bgtechlab/bg-reels-bot','bgtechlab/history-facts'
];
const SITES=[
 {name:'Job Page Auto Publisher',tag:'Website',repo:'bgtechlab/Job-Page-Auto-Publisher',url:'https://bgtechlab.github.io/Job-Page-Auto-Publisher/'},
 {name:'Amazon to Blogger',tag:'Website',repo:'bgtechlab/amazon_to_blogger',url:'https://bgtechlab.github.io/amazon_to_blogger/'},
 {name:'News Blog Auto Publisher',tag:'Website',repo:'bgtechlab/News-Blog-Auto-Publisher',url:'https://bgtechlab.github.io/News-Blog-Auto-Publisher/'},
 {name:'Trending-Topic-Finder',tag:'Trending Topics',repo:'bgtechlab/Trending-Topic-Finder',url:'https://bgtechlab.github.io/Trending-Topic-Finder/'}
];
const HIDDEN_REPOS=['bgsarkariresult/bgsarkariresult','bgsarkariresult/youtube-live-bot','bgtechlab/bgtech'];
// Compatibility fallback: older cached app.js versions may not expose okRun.
const okRun = window.okRun || ((r) => String(r?.s || '') === 'success');
const RUN_STATES=['in_progress','queued','waiting','pending','requested'];
const FAIL_STATES=['failure','timed_out','action_required','startup_failure','stale'];

const lc=s=>String(s||'').toLowerCase();
const slugOf=b=>String(b.repo||b.name||'x').replace(/[^a-zA-Z0-9]/g,'_');
const cfgFor=b=>BOT_CONFIG[lc(b.repo)]||{};
const workflowFor=b=>b.workflow||cfgFor(b).workflow||'';
const inputFor=b=>(b.input_name!==undefined?b.input_name:cfgFor(b).input)||null;
function safeUrl(u){try{const x=new URL(String(u||''),location.href);return x.protocol==='https:'||x.protocol==='http:'?x.href:'#'}catch(_){return'#'}}
function latestState(b){return String((Array.isArray(b.runs)&&b.runs[0]&&b.runs[0].s)||b.status||'unknown')}
function isFail(b){const s=latestState(b);return FAIL_STATES.includes(s)||!!b.failed&&s!=='success'&&!RUN_STATES.includes(s)}
function stateMeta(s){
 s=String(s||'unknown');
 const m={
  success:{i:'🟢',l:'Success',c:'success'},failure:{i:'🔴',l:'Failed',c:'failure'},
  in_progress:{i:'🔵',l:'Running',c:'running'},queued:{i:'🟡',l:'Queued',c:'running'},
  waiting:{i:'⏸️',l:'Waiting',c:'paused'},pending:{i:'⏸️',l:'Pending',c:'paused'},
  cancelled:{i:'🚫',l:'Cancelled',c:'paused'},skipped:{i:'⏭️',l:'Skipped',c:'paused'},
  timed_out:{i:'⏱️',l:'Timed Out',c:'failure'},action_required:{i:'⚠️',l:'Action Required',c:'paused'},
  requested:{i:'📨',l:'Requested',c:'running'},neutral:{i:'➖',l:'Neutral',c:'paused'},
  stale:{i:'🕰️',l:'Stale',c:'failure'},startup_failure:{i:'💥',l:'Startup Failed',c:'failure'},
  unknown:{i:'?',l:'Unknown',c:'paused'}
 };
 return m[s]||{i:'•',l:s.replace(/_/g,' '),c:'paused'};
}
function stateBadge(s,count){const m=stateMeta(s);return '<span class="badge-s '+m.c+'">'+m.i+' '+(count||0)+' '+m.l+'</span>'}
function failureDetail(b){
 if(!b||!b.failed)return '';
 return [b.failed.job&&('Job: '+b.failed.job),b.failed.step&&('Step: '+b.failed.step),
 b.failed.reason&&String(b.failed.reason).replace(/_/g,' ')].filter(Boolean).join(' · ');
}

const UI={open:new Set(),links:{},msgs:{},busy:{},log:{repo:null,workflow:'',timer:null,token:0,state:{}}};
let REG={};
function setMsg(id,v,isHtml){UI.msgs[id]={v,isHtml:!!isHtml,t:Date.now()};const e=document.getElementById(id);if(e){if(isHtml)e.innerHTML=v;else e.textContent=v}}
function restoreMsgs(){for(const id in UI.msgs){const m=UI.msgs[id];if(Date.now()-m.t>60000){delete UI.msgs[id];continue}const e=document.getElementById(id);if(e){if(m.isHtml)e.innerHTML=m.v;else e.textContent=m.v}}}

boot('control.html','GitHub Actions Control Center',d=>{
 const ae=document.activeElement,aeId=ae&&ae.id,selS=ae&&typeof ae.selectionStart==='number'?ae.selectionStart:null;
 REG={};
 const bots=Array.isArray(d.bots)?d.bots:[];
 const siteBots=SITES.map(w=>{
  const f=bots.find(x=>lc(x.repo)===lc(w.repo));
  if(f){if(!f.site)f.site=w.url;return f}
  return {name:w.name,repo:w.repo,site:w.url,tag:w.tag,status:'unknown',runs:[]};
 });
 const siteRepos=SITES.map(w=>lc(w.repo));
 const running=bots.filter(b=>RUN_STATES.includes(latestState(b)));
 const fails=bots.filter(isFail);
 const allRuns=bots.flatMap(b=>Array.isArray(b.runs)?b.runs:[]);
 const stateCounts=allRuns.reduce((a,r)=>{const s=String(r.s||'unknown');a[s]=(a[s]||0)+1;return a},{});
 let liveNote=d.live_state==='live'?'✔ Live API चालू है। PAT Worker में सुरक्षित है (browser में नहीं)।':
 d.live_state==='partial'?'⚠ Live API आंशिक है — '+(d.live_api_errors||0)+' repo पढ़ नहीं पाया, बाकी cached data दिख रहा है।':
 '⚠ Live API उपलब्ध नहीं — dashboard.json का cached data दिख रहा है।';
 const otherBots=bots.filter(b=>{const r=lc(b.repo);return !YT_REPOS.includes(r)&&!siteRepos.includes(r)&&!HIDDEN_REPOS.includes(r)});
 $('#main').innerHTML=
 '<div class="card"><div class="hd"><h2>🔑 Worker Proxy</h2><button class="btn g" type="button" id="syncBtn" onclick="runSync()">↻ Sync Dashboard</button></div><small id="patStatus">'+esc(liveNote)+' Origin: bgsarkariresult.github.io</small><small id="syncMsg" style="display:block;margin-top:6px"></small></div>'+
 '<div class="card"><div class="hd"><h2>📊 Automation States</h2><small>Live sync data</small></div><div style="display:flex;flex-wrap:wrap;gap:6px">'+
 ['success','failure','in_progress','queued','waiting','pending','cancelled','skipped','timed_out','action_required','requested','neutral','stale','startup_failure'].map(s=>stateBadge(s,stateCounts[s])).join('')+
 '</div><small style="display:block;margin-top:8px;color:var(--mu)">0 ka matlab recent sync mein us state ka run nahi mila.</small></div>'+
 '<div class="card"><h2>⏳ Chal rahe</h2>'+(running.map(b=>{const u=safeUrl(b.url);return '<div class="li"><span>'+esc(b.name)+'</span>'+(u!=='#'?'<a class="t" href="'+esc(u)+'" target="_blank" rel="noopener">Dekho</a>':'')+'</div>'}).join('')||'<small>Abhi koi automation nahi chal raha.</small>')+'</div>'+
 '<div class="card"><h2>❌ Asafal + Errors</h2>'+(fails.map(b=>{
   const s=slugOf(b);REG[s]=b;const f=b.failed||{},r0=(b.runs&&b.runs[0])||{},u=safeUrl(f.url||r0.u||b.url),noWf=!workflowFor(b);
   return '<div class="li"><span><b>'+esc(b.name)+'</b><br><small>Fail: '+esc(f.job||'—')+' → '+esc(f.step||'—')+' • '+ago(f.t||r0.t)+'</small></span><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" type="button" onclick="startBot(\''+s+'\',\'rerun\')" '+(noWf||UI.busy[s]?'disabled':'')+'>'+ (UI.busy[s]?'⏳ Starting…':'▶ दोबारा चलाएँ')+'</button>'+(u!=='#'?'<a class="btn g t" href="'+esc(u)+'" target="_blank" rel="noopener">Log</a>':'')+'</div></div>'
 }).join('')||'<small>Koi asafal run nahi.</small>')+'<small id="rerunMsg" style="display:block;margin-top:6px"></small></div>'+
 '<div class="card" id="liveLogPanel" hidden><div class="hd"><h2>💻 Live Logs <small id="liveLogTitle"></small></h2><button class="btn g" type="button" onclick="closeLiveLogs()">✕ बंद करें</button></div><div id="liveLogBody"><small>प्रोजेक्ट चुनें।</small></div></div>'+
 '<div class="card"><h2>🌐 Websites <small>(वेबसाइट)</small></h2><div class="sites">'+siteBots.map(renderProjectCard).join('')+'</div><button class="btn g" type="button" onclick="addProject(\'website\')">＋ Add Website</button></div>'+
 '<div class="card"><h2>▶ YouTube Channels <small>(यूट्यूब चैनल)</small></h2><div class="sites">'+bots.filter(b=>YT_REPOS.includes(lc(b.repo))).map(renderProjectCard).join('')+'</div><button class="btn g" type="button" onclick="addProject(\'youtube\')">＋ Add YouTube Channel</button></div>'+
 '<div class="card"><h2>🧰 Other Automations</h2><div class="sites">'+(otherBots.map(renderProjectCard).join('')||'<small>कोई और automation नहीं।</small>')+'</div></div>';
 restoreMsgs();restoreLogs();
 if(aeId){const e=document.getElementById(aeId);if(e&&e.focus){e.focus();if(selS!==null&&e.setSelectionRange){try{e.setSelectionRange(selS,selS)}catch(_){}}}}
});

function renderProjectCard(b){
 const s=slugOf(b);REG[s]=b;const wf=workflowFor(b),input=inputFor(b),multi=!!cfgFor(b).multi,runs=Array.isArray(b.runs)?b.runs:[],state=latestState(b),sm=stateMeta(state),detail=isFail(b)?failureDetail(b):'',busy=!!UI.busy[s],open=UI.open.has(s);
 const okN=runs.filter(okRun).length,failN=runs.filter(r=>FAIL_STATES.includes(r.s)).length;
 const linkBox=input?'<input class="lk" id="lk_'+s+'" value="'+esc(UI.links[s]||'')+'" oninput="UI.links[\''+s+'\']=this.value" placeholder="'+(multi?'Link(s) dalo (article / product URL) — optional':'Link dalo (article / product URL) — optional')+'" inputmode="url" autocomplete="off">':'';
 const status='<div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px"><span class="badge-s '+sm.c+'">'+sm.i+' '+sm.l+'</span>'+(detail?'<small style="color:var(--mu)">'+esc(detail)+'</small>':'')+'</div>'+(b.live_api_error?'<small style="display:block;color:var(--mu);margin-top:4px">⚠ Live API: '+esc(b.live_api_error)+'</small>':'');
 const items=runs.slice(0,5).map(r=>'<div class="run-item"><span class="dot s-'+esc(r.s)+'">'+st(r.s)+'</span><span class="run-info"><b>'+esc(r.n)+'</b><small>'+esc(r.s)+' • '+ago(r.t)+'</small></span>'+(safeUrl(r.u)!=='#'?'<a class="btn g t" href="'+esc(safeUrl(r.u))+'" target="_blank" rel="noopener">Log ↗</a>':'')+'</div>').join('')||'<small>Koi run nahi.</small>';
 return '<div class="site"><div class="row"><div><b>'+esc(b.name)+'</b><br><small>'+okN+' safal • '+failN+' fail (pichhle '+runs.length+' run)</small>'+status+'</div></div>'+
 linkBox+'<div class="project-actions"><button class="btn g" type="button" onclick="showLiveLogs(\''+s+'\')">📋 Logs</button><button class="btn run-action" type="button" id="btn_'+s+'" onclick="startBot(\''+s+'\',\'run\')" '+(!wf||busy?'disabled':'')+'>'+ (busy?'⏳ Starting…':'▶ Run')+'</button><button class="btn g" type="button" onclick="tg(\''+s+'\')" aria-controls="rs_'+s+'" aria-expanded="'+open+'">↻ Runs</button></div>'+
 '<small class="hn" id="hn_'+s+'" role="status" aria-live="polite"></small><div class="rs" id="rs_'+s+'" '+(open?'':'hidden')+'><div class="runs-heading">पिछले 5 रन</div>'+items+'</div></div>';
}
function addProject(type){const name=type==='website'?'Website':'YouTube Channel';if(confirm('Naya '+name+' जोड़ने के लिए data/dashboard.json में project दर्ज करना होगा.\n\nGitHub का edit पेज खोलें?'))window.open(GH_EDIT_URL,'_blank','noopener')}
function tg(s){const e=document.getElementById('rs_'+s);if(!e)return;e.hidden=!e.hidden;if(e.hidden)UI.open.delete(s);else UI.open.add(s);const b=e.parentElement.querySelector('[aria-controls="rs_'+s+'"]');if(b)b.setAttribute('aria-expanded',String(!e.hidden))}

const TERM_STYLE='background:#071426;color:#dce8fa;border:1px solid #22354f;border-radius:12px;padding:14px;max-height:420px;overflow:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere';
function logSkeleton(){const b=document.getElementById('liveLogBody');if(!b)return;b.innerHTML='<div id="logStatus" class="li"></div><small id="logHint"></small><div class="log-terminal" id="logTerminal" style="'+TERM_STYLE+'"></div><div id="logSteps" style="margin-top:10px"></div><small id="logMsg"></small>'}
function paintLogs(){
 const L=UI.log,S=L,title=document.getElementById('liveLogTitle'),cur=(window.D&&Array.isArray(window.D.bots)?window.D.bots:[]).find(x=>lc(x.repo)===lc(L.repo));
 if(title)title.textContent='— '+(S.title||S.name||'');
 const stEl=document.getElementById('logStatus');if(stEl)stEl.innerHTML='<b>स्थिति</b>'+chip(cur?latestState(cur):'unknown');
 const h=document.getElementById('logHint');if(h)h.textContent=S.hint||'';
 const t=document.getElementById('logTerminal');if(t){const near=t.scrollHeight-t.scrollTop-t.clientHeight<40;t.textContent=S.term||'';if(near)t.scrollTop=t.scrollHeight}
 const steps=document.getElementById('logSteps');if(steps)steps.innerHTML=S.steps||'';
 const msg=document.getElementById('logMsg');if(msg)msg.textContent=S.msg||'';
}
function restoreLogs(){if(!UI.log.repo)return;const p=document.getElementById('liveLogPanel');if(!p)return;p.hidden=false;logSkeleton();paintLogs()}
function showLiveLogs(s){
 const b=REG[s],L=UI.log,p=document.getElementById('liveLogPanel');if(!b||!p)return;
 clearTimeout(L.timer);L.token++;L.repo=b.repo;L.workflow=workflowFor(b);L.state={name:b.name,term:'⏳ GitHub Actions se asli logs liye ja rahe hain…',steps:'',msg:'',hint:'GitHub Actions se har 5 second mein refresh hota hai.'};
 p.hidden=false;logSkeleton();paintLogs();p.scrollIntoView({behavior:'smooth',block:'start'});pollLogs();
}
function closeLiveLogs(){const L=UI.log;clearTimeout(L.timer);L.token++;L.repo=null;const p=document.getElementById('liveLogPanel');if(p)p.hidden=true}
async function pollLogs(){
 const L=UI.log;if(!L.repo)return;clearTimeout(L.timer);if(document.hidden){L.timer=setTimeout(pollLogs,5000);return}
 const tok=++L.token;try{
  const data=await callWorker({action:'logs',repo:L.repo,workflow:L.workflow},false,true);if(tok!==L.token||!L.repo)return;
  if(!data.ok)throw new Error(data.error||('HTTP '+(data.status||'error')));
  const lines=Array.isArray(data.lines)?data.lines:[],jobs=Array.isArray(data.jobs)?data.jobs:[];
  L.state.term=lines.length?lines.join('\n'):'⏳ Raw log lines GitHub se abhi nahi mile. Status har 5 second mein refresh ho raha hai.';
  L.state.steps=jobs.map(j=>'<div class="li"><b>'+esc(j.name)+'</b>'+chip(j.conclusion||j.status||'queued')+'</div>'+
   (j.steps||[]).map(x=>{const icon=x.conclusion==='success'?'✓':x.conclusion==='failure'?'✕':x.status==='in_progress'?'⏳':'○';return '<div style="margin-left:12px;padding:7px 0;border-bottom:1px solid var(--line)"><div class="li"><span>'+icon+' '+esc(x.number||'')+'. '+esc(x.name)+'</span>'+chip(x.conclusion||x.status||'queued')+'</div></div>'}).join('')).join('');
  L.state.msg=data.message||'';if(data.run)L.state.title=L.state.name+' · #'+data.run.id+' · '+(data.run.conclusion||data.run.status);
  if(data.run&&data.run.status==='completed')L.state.hint='✅ Run पूरा हो गया — auto-refresh बंद। नया run चलाने पर फिर 📋 Logs दबाएँ।';
  paintLogs();if(!(data.run&&data.run.status==='completed'))L.timer=setTimeout(pollLogs,5000);
 }catch(e){L.state.msg='❌ '+e.message;paintLogs();L.timer=setTimeout(pollLogs,7000)}
}

function getPin(){try{return localStorage.getItem('bg_pin')||''}catch(_){return''}}
function savePin(p){try{localStorage.setItem('bg_pin',p)}catch(_){}}
async function callWorker(payload,retried,silent){
 const body=Object.assign({},payload||{}),pin=getPin();if(pin)body.pin=pin;
 const res=await fetch(WORKER_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 let data={};try{data=await res.json()}catch(_){data={ok:false,error:'Invalid response',status:res.status}}
 const pinNeeded=(res.status===401||data.status===401)&&/pin/i.test(String(data.error||''));
 if(pinNeeded&&!retried){const p=prompt('PIN daalo:');if(p){savePin(p.trim());return callWorker(payload,true,silent)}}
 return data;
}
async function runSync(){
 const m=document.getElementById('syncMsg');if(m)m.textContent='⏳ Sync start ho raha hai...';
 try{const data=await callWorker({repo:'bgsarkariresult/BG-Automation',workflow:'sync.yml',ref:'main'});
  if(data.ok){if(m)m.innerHTML='✅ <b>Sync start ho gaya!</b> 30–60 sec baad live status update hoga.';setTimeout(()=>window.refreshDashboard&&window.refreshDashboard(),1500)}
  else if(m)m.textContent='❌ Sync fail: '+(data.error||data.status||'unknown');
 }catch(e){if(m)m.textContent='❌ Network error: '+e.message}
}
async function startBot(s,mode){
 const b=REG[s];if(!b)return;
 const wf=workflowFor(b),input=inputFor(b),btn=document.getElementById('btn_'+s),hn=document.getElementById('hn_'+s),linkEl=document.getElementById('lk_'+s);
 if(!wf){if(hn)hn.textContent='❌ Is project ka workflow configured nahi hai.';return}
 const link=(linkEl&&linkEl.value||UI.links[s]||'').trim(),payload={repo:b.repo,workflow:wf,ref:'main'};
 if(input&&link)payload.inputs={[input]:link};
 UI.busy[s]=true;if(btn){btn.disabled=true;btn.textContent='⏳ Starting…'}if(hn)hn.textContent='⏳ Cloudflare Worker → GitHub Actions…';
 try{
  const data=await callWorker(payload,false);
  if(data.ok){
   if(hn)hn.innerHTML='✅ <b>GitHub Actions शुरू हो गया!</b> Worker + Master PAT से run भेजा गया।';
   if(btn){btn.textContent='✅ Started'}
   setTimeout(()=>window.refreshDashboard&&window.refreshDashboard(),1200);
   setTimeout(()=>window.refreshDashboard&&window.refreshDashboard(),5000);
  }else{
   const code=data.status||'';let msg=data.error||data.message||'unknown';
   if(code===404)msg='Repo/workflow नहीं मिला: '+b.repo+' / '+wf;
   if(code===422)msg='GitHub ने request reject की (422). Required input या workflow configuration check करें.';
   if(hn)hn.textContent='❌ Worker error '+code+': '+String(msg).slice(0,260);
  }
 }catch(e){if(hn)hn.textContent='❌ Worker network error: '+e.message}
 finally{delete UI.busy[s];if(btn){btn.disabled=false;btn.textContent='▶ Run'}}
}
window.startBot=startBot;
window.runSync=runSync;
window.showLiveLogs=showLiveLogs;
window.closeLiveLogs=closeLiveLogs;
window.tg=tg;
</script>
</body>
</html>
