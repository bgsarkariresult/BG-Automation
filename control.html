<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Actions Control</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
/* ========== CONFIG ========== */
const WORKER_URL = 'https://bg-runf.garhwalbhavesh2002.workers.dev/';

/* Har bot ke workflow input ka naam */
const INPUT_MAP = {
  'bgsarkariresult/SG-News18': 'article_url',
  'bgsarkariresult/TechGlow-India': 'article_url',
  'bgsarkariresult/Bk-growup-': 'post_url',
  'bgtechlab/BG-Reels-Bot': 'product_url',
  'bgtechlab/Trending-Topic-Finder': null,
  'bgtechlab/Job-Page-Auto-Publisher': 'job_url',
  'bgtechlab/amazon_to_blogger': 'urls',
  'bgtechlab/News-Blog-Auto-Publisher': 'news_urls'
};

boot('control.html', 'GitHub Actions Control Center', d => {
  const run = d.bots.filter(b => ['in_progress', 'queued'].includes(b.status));
  const fails = d.bots.filter(b => b.failed);

  $('#main').innerHTML = `
    <div class="card">
      <div class="hd">
        <h2>🔑 Worker Proxy</h2>
        <button class="btn g" onclick="runSync()">↻ Sync Dashboard</button>
      </div>
      <small id="patStatus">✔ PAT Worker par hai (browser mein nahi). Origin: bgsarkariresult.github.io</small>
      <small id="syncMsg" style="display:block;margin-top:6px"></small>
    </div>

    <div class="card">
      <h2>⏳ Chal rahe</h2>
      ${run.map(b => `<div class="li"><span>${esc(b.name)}</span>
        <a class="t" href="${esc(b.url)}" target="_blank" rel="noopener">Dekho</a></div>`).join('')
        || '<small>Abhi koi automation nahi chal raha.</small>'}
    </div>

    <div class="card">
      <h2>❌ Asafal + Errors</h2>
      ${fails.map(b => {
        const idx = d.bots.indexOf(b);
        return `<div class="li">
          <span><b>${esc(b.name)}</b><br>
          <small>Fail: ${esc(b.failed.job)} → ${esc(b.failed.step)} • ${ago(b.failed.t)}</small></span>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn" onclick="rerunBot(${idx})">▶ Re-run</button>
            <a class="btn g t" href="${esc(b.failed.url)}" target="_blank" rel="noopener">Log</a>
          </div>
        </div>`;
      }).join('') || '<small>Koi asafal run nahi.</small>'}
      <small id="rerunMsg" style="display:block;margin-top:6px"></small>
    </div>

    <div class="card" id="liveLogPanel" hidden>
      <div class="hd"><h2>💻 Live Logs <small id="liveLogTitle"></small></h2><button class="btn g" onclick="closeLiveLogs()">✕ बंद करें</button></div>
      <div id="liveLogBody"><small>प्रोजेक्ट चुनें।</small></div>
    </div>
    <div class="card">
      <h2>🌐 Websites <small>(वेबसाइट)</small></h2>
      <div class="sites">
        ${[
          {name:'Job Page Auto Publisher',tag:'Website',repo:'bgtechlab/Job-Page-Auto-Publisher',url:'https://bgtechlab.github.io/Job-Page-Auto-Publisher/'},
          {name:'Amazon to Blogger',tag:'Website',repo:'bgtechlab/amazon_to_blogger',url:'https://bgtechlab.github.io/amazon_to_blogger/'},
          {name:'News Blog Auto Publisher',tag:'Website',repo:'bgtechlab/News-Blog-Auto-Publisher',url:'https://bgtechlab.github.io/News-Blog-Auto-Publisher/'},
          {name:'Trending-Topic-Finder',tag:'Trending Topics',repo:'bgtechlab/Trending-Topic-Finder',url:'https://bgtechlab.github.io/Trending-Topic-Finder/'}
        ].map(w => {
          let bot=d.bots.find(x=>x.repo===w.repo);
          if (!bot) {
            const workflows={
              'bgtechlab/Job-Page-Auto-Publisher':'job-page-publisher.yml',
              'bgtechlab/amazon_to_blogger':'amazon_to_blogger.yml',
              'bgtechlab/News-Blog-Auto-Publisher':'news-blog-publisher.yml',
              'bgtechlab/Trending-Topic-Finder':'daily-auto-run.yml'
            };
            bot={name:w.name,repo:w.repo,workflow:workflows[w.repo],site:w.url,tag:w.tag,status:'unknown',runs:[]};
            d.bots.push(bot);
          }
          if (!bot.site) bot.site=w.url;
          return renderProjectCard(bot);
        }).join('')}
      </div>
      <button class="btn g" onclick="addProject('website')">＋ Add Website</button>
    </div>
    <div class="card">
      <h2>▶ YouTube Channels <small>(यूट्यूब चैनल)</small></h2>
      <div class="sites">
        ${d.bots.filter(b => ['bgsarkariresult/Bk-growup-','bgtechlab/BG-Reels-Bot','bgsarkariresult/youtube-live-bot','bgsarkariresult/TechGlow-India'].includes(b.repo)).map(b => renderProjectCard(b)).join('')}
      </div>
      <button class="btn g" onclick="addProject('youtube')">＋ Add YouTube Channel</button>
    </div>
    <div class="card">
      <h2>🧰 Other Automations</h2>
      <div class="sites">
        ${d.bots.filter(b => !['bgsarkariresult/SG-News18','bgsarkariresult/TechGlow-India','bgsarkariresult/bgsarkariresult','bgsarkariresult/Bk-growup-','bgtechlab/BG-Reels-Bot','bgsarkariresult/youtube-live-bot','bgtechlab/bgtech','bgtechlab/Trending-Topic-Finder','bgtechlab/Job-Page-Auto-Publisher','bgtechlab/amazon_to_blogger','bgtechlab/News-Blog-Auto-Publisher'].includes(b.repo)).map(b => renderProjectCard(b)).join('')}
      </div>
    </div>`;
});

function renderProjectCard(b) {
  const i=window.D.bots.indexOf(b);
  return `<div class="site">
    <div class="row"><div><b>${esc(b.name)}</b><br><small>${b.runs.filter(okRun).length} safal • ${b.runs.filter(r => r.s === 'failure').length} fail (pichhle ${b.runs.length} run)</small></div>${chip(b.status)}</div>
    <input class="lk" id="lk${i}" placeholder="Link dalo (article / product URL) — optional">
    <div class="r"><button class="btn g" onclick="showLiveLogs(${i})">Logs</button><button class="btn" id="btn${i}" onclick="runBot(${i})" ${!b.workflow ? 'disabled title="Iske paas workflow nahi"' : ''}>▶ Run</button><button class="btn g" onclick="tg(${i})">Status</button></div>
    <small class="hn" id="hn${i}"></small><div class="rs" id="rs${i}" hidden>${b.runs.slice(0,5).map(r=>`<div class="li"><span class="dot s-${esc(r.s)}">${st(r.s)}</span><span>${esc(r.n)}<br><small>${esc(r.s)} • ${ago(r.t)}</small></span><a class="t" href="${esc(r.u)}" target="_blank" rel="noopener">Log</a></div>`).join('')||'<small>Koi run nahi.</small>'}</div>
  </div>`;
}
function addProject(type) {
  const name=type==='website'?'Website':'YouTube Channel';
  alert('Naya '+name+' जोड़ने के लिए data/dashboard.json में इसका project दर्ज करें।');
}

let liveLogTimer=null;
function closeLiveLogs(){const p=document.getElementById("liveLogPanel");if(p)p.hidden=true;if(liveLogTimer){clearInterval(liveLogTimer);liveLogTimer=null;}}
function showLiveLogs(i){
 const b=window.D.bots[i], panel=document.getElementById("liveLogPanel"); if(!b||!panel)return;
 panel.hidden=false;document.getElementById("liveLogTitle").textContent="— "+b.name;
 const body=document.getElementById("liveLogBody");
 body.innerHTML='<small>⏳ GitHub Actions se asli logs liye ja rahe hain…</small>';
 const draw=async()=>{
   const current=window.D.bots.find(x=>x.repo===b.repo)||b;
   body.innerHTML='<div class="li"><b>स्थिति</b>'+chip(current.status||"unknown")+'</div><small>GitHub Actions se har 5 second mein refresh hota hai.</small><div class="log-terminal" id="logTerminal" style="background:#071426;color:#dce8fa;border:1px solid #22354f;border-radius:12px;padding:14px;max-height:420px;overflow:auto;font:13px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere">⏳ Logs load ho rahe hain…</div><div id="logSteps" style="margin-top:10px"></div><small id="logMsg"></small>';
   try{
     const data=await callWorker({action:"logs",repo:b.repo,workflow:b.workflow});
     if(!data.ok)throw new Error(data.error||("HTTP "+(data.status||"error")));
     const lines=Array.isArray(data.lines)?data.lines:[];
     const jobs=data.jobs||[];
     const activeJob=jobs.find(j=>j.status==="in_progress")||jobs.find(j=>j.status==="queued");
     const activeStep=activeJob&&(activeJob.steps||[]).find(s=>s.status==="in_progress");
     const stepsHtml=jobs.map(j=>'<div class="li"><b>'+esc(j.name)+'</b>'+chip(j.conclusion||j.status||"queued")+'</div>'+(j.steps||[]).map(s=>{
       const active=j===activeJob&&s===activeStep;
       const icon=s.conclusion==="success"?"✓":s.conclusion==="failure"?"✕":s.status==="in_progress"?"⏳":"○";
       return '<div style="margin-left:12px;padding:7px 0;border-bottom:1px solid var(--line)"><div class="li"><span>'+icon+' '+esc(s.number||"")+'. '+esc(s.name)+'</span>'+chip(s.conclusion||s.status||"queued")+'</div>'+(active?'<div style="margin:6px 0 10px 8px;background:#071426;color:#dce8fa;border:1px solid #22354f;border-radius:10px;padding:12px;max-height:320px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere">'+esc(lines.length?lines.join("\n"):"⏳ Is step ke raw log lines GitHub se abhi nahi mile. Status har 5 second mein refresh ho raha hai.")+'</div>':'');
     }).join('')).join('');
     document.getElementById("logSteps").innerHTML=stepsHtml;
     document.getElementById("logMsg").textContent=data.message||"";
     document.getElementById("logMsg").textContent=data.message||"";
     if(data.run){document.getElementById("liveLogTitle").textContent="— "+b.name+" · #"+data.run.id+" · "+(data.run.conclusion||data.run.status); }
   }catch(e){const term=document.getElementById("logTerminal");if(term)term.textContent="Logs load nahi hue: "+e.message;}
 };
 draw();if(liveLogTimer)clearInterval(liveLogTimer);liveLogTimer=setInterval(()=>{if(!panel.hidden)draw()},5000);
}
function tg(i) {
  const e = document.getElementById('rs' + i);
  e.hidden = !e.hidden;
}

/* ========== Worker se workflow dispatch ========== */
async function callWorker(payload) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload || {})
  });
  let data = {};
  try {
    data = await res.json();
  } catch (_) {
    data = { ok: false, error: 'Invalid response', status: res.status };
  }
  return data;
}

/* Dashboard sync (default worker action) */
async function runSync() {
  const msg = document.getElementById('syncMsg');
  if (msg) msg.textContent = '⏳ Sync start ho raha hai...';
  try {
    const data = await callWorker({
      repo: 'bgsarkariresult/BG-Automation',
      workflow: 'sync.yml',
      ref: 'main'
    });
    if (data.ok) {
      if (msg) msg.innerHTML = '✅ <b>Sync start ho gaya!</b> 30–60 sec baad page refresh karo.';
    } else {
      if (msg) msg.textContent = '❌ Sync fail: ' + (data.error || data.status || 'unknown');
    }
  } catch (e) {
    if (msg) msg.textContent = '❌ Network error: ' + e.message;
  }
}

/* Bot run via Worker */
async function runBot(i) {
  const b = window.D.bots[i];
  const link = (document.getElementById('lk' + i).value || '').trim();
  const hn = document.getElementById('hn' + i);
  const btn = document.getElementById('btn' + i);

  if (!b.workflow) {
    hn.textContent = '❌ Is project ke paas workflow file nahi hai';
    return;
  }

  const inputName = INPUT_MAP[b.repo] || null;
  const payload = {
    repo: b.repo,
    workflow: b.workflow,
    ref: 'main'
  };
  if (inputName && link) {
    payload.inputs = { [inputName]: link };
  }

  btn.disabled = true;
  hn.textContent = '⏳ Workflow start ho raha hai...';

  try {
    const data = await callWorker(payload);

    if (data.ok) {
      hn.innerHTML = '✅ <b>Start ho gaya!</b> Status 30–60 sec baad refresh hoga.';
    } else if (data.status === 401 || data.status === 403) {
      hn.textContent = '❌ Worker / PAT permission error (GH_TOKEN check karo)';
    } else if (data.status === 404) {
      hn.textContent = '❌ Workflow ya repo nahi mila: ' + b.workflow;
    } else if (data.status === 422) {
      hn.textContent = '❌ Input missing / galat (422). Link daalo agar required hai. ' + (data.error || '').slice(0, 80);
    } else {
      hn.textContent = '❌ Error ' + (data.status || '') + ': ' + (data.error || 'unknown').toString().slice(0, 120);
    }
  } catch (e) {
    hn.textContent = '❌ Network error: ' + e.message + ' (sirf bgsarkariresult.github.io se chalega)';
  } finally {
    btn.disabled = false;
  }
}

/* Failed bot ko dubara same workflow se chalao (naya run) */
async function rerunBot(i) {
  const b = window.D.bots[i];
  const msg = document.getElementById('rerunMsg');
  if (!b.workflow) {
    if (msg) msg.textContent = '❌ Workflow nahi mila';
    return;
  }
  if (msg) msg.textContent = '⏳ Re-run start ho raha hai...';

  try {
    const data = await callWorker({
      repo: b.repo,
      workflow: b.workflow,
      ref: 'main'
    });
    if (data.ok) {
      if (msg) msg.innerHTML = '✅ <b>Re-run start ho gaya!</b> (' + esc(b.name) + ')';
    } else {
      if (msg) msg.textContent = '❌ Re-run fail: ' + (data.error || data.status || 'unknown');
    }
  } catch (e) {
    if (msg) msg.textContent = '❌ Network error: ' + e.message;
  }
}
</script>
</body>
</html>
