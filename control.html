<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Actions Control</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<script src="app.js"></script>
<script>
/* Har bot ke workflow input ka naam */
const INPUT_MAP = {
  'bgsarkariresult/SG-News18': 'article_url',
  'bgsarkariresult/TechGlow-India': 'article_url',
  'bgsarkariresult/Bk-growup-': 'post_url',
  'bgtechlab/BG-Reels-Bot': 'product_url',
  'bgtechlab/Trending-Topic-Finder': null   // koi input nahi
};

boot('control.html', 'GitHub Actions Control Center', d => {
  const run = d.bots.filter(b => ['in_progress', 'queued'].includes(b.status));
  const fails = d.bots.filter(b => b.failed);

  $('#main').innerHTML = `
    <div class="card">
      <div class="hd">
        <h2>🔑 GitHub PAT</h2>
        <button class="btn g" onclick="setPat()">PAT Set / Change</button>
      </div>
      <small id="patStatus">${localStorage.getItem('GH_PAT') ? '✔ PAT save hai (localStorage)' : '⚠ Pehle PAT set karo (repo + workflow scope)'}</small>
    </div>

    <div class="card">
      <h2>⏳ Chal rahe</h2>
      ${run.map(b => `<div class="li"><span>${esc(b.name)}</span>
        <a class="t" href="${esc(b.url)}" target="_blank" rel="noopener">Dekho</a></div>`).join('')
        || '<small>Abhi koi automation nahi chal raha.</small>'}
    </div>

    <div class="card">
      <h2>❌ Asafal + Errors</h2>
      ${fails.map(b => `<div class="li">
        <span><b>${esc(b.name)}</b><br>
        <small>Fail: ${esc(b.failed.job)} → ${esc(b.failed.step)} • ${ago(b.failed.t)}</small></span>
        <a class="btn g t" href="${esc(b.failed.url)}" target="_blank" rel="noopener">Log / Re-run</a>
      </div>`).join('') || '<small>Koi asafal run nahi.</small>'}
      <small>Re-run: us page par "Re-run failed jobs" dabao.</small>
    </div>

    <div class="sites">
      ${d.bots.map((b, i) => `
        <div class="site">
          <div class="row">
            <div>
              <b>${esc(b.name)}</b><br>
              <small>${b.runs.filter(okRun).length} safal • ${b.runs.filter(r => r.s === 'failure').length} fail (pichhle ${b.runs.length} run)</small>
            </div>
            ${chip(b.status)}
          </div>
          <input class="lk" id="lk${i}" placeholder="Link dalo (article / product URL) — optional">
          <div class="r">
            <a class="btn g" href="${esc(b.site || 'https://github.com/' + b.repo)}" target="_blank" rel="noopener">Open</a>
            <button class="btn" id="btn${i}" onclick="runBot(${i})" ${!b.workflow ? 'disabled title="Iske paas workflow nahi"' : ''}>▶ Run</button>
            <button class="btn g" onclick="tg(${i})">Status</button>
          </div>
          <small class="hn" id="hn${i}"></small>
          <div class="rs" id="rs${i}" hidden>
            ${b.runs.slice(0, 5).map(r => `
              <div class="li">
                <span class="dot s-${esc(r.s)}">${st(r.s)}</span>
                <span>${esc(r.n)}<br><small>${esc(r.s)} • ${ago(r.t)}</small></span>
                <a class="t" href="${esc(r.u)}" target="_blank" rel="noopener">Log</a>
              </div>`).join('') || '<small>Koi run nahi.</small>'}
          </div>
        </div>`).join('')}
    </div>`;
});

function tg(i) {
  const e = document.getElementById('rs' + i);
  e.hidden = !e.hidden;
}

function setPat() {
  const cur = localStorage.getItem('GH_PAT') || '';
  const pat = prompt('GitHub PAT daalo (classic token, scopes: repo + workflow):\n\nPurana token clear karne ke liye blank chhod do.', cur);
  if (pat === null) return;
  if (!pat.trim()) {
    localStorage.removeItem('GH_PAT');
    document.getElementById('patStatus').textContent = '⚠ PAT hata diya';
  } else {
    localStorage.setItem('GH_PAT', pat.trim());
    document.getElementById('patStatus').textContent = '✔ PAT save ho gaya';
  }
}

async function runBot(i) {
  const b = window.D.bots[i];
  const link = (document.getElementById('lk' + i).value || '').trim();
  const hn = document.getElementById('hn' + i);
  const btn = document.getElementById('btn' + i);

  if (!b.workflow) {
    hn.textContent = '❌ Is project ke paas workflow file nahi hai';
    return;
  }

  let pat = localStorage.getItem('GH_PAT');
  if (!pat) {
    setPat();
    pat = localStorage.getItem('GH_PAT');
    if (!pat) {
      hn.textContent = '⚠ Pehle PAT set karo';
      return;
    }
  }

  const inputName = INPUT_MAP[b.repo] || null;
  const body = { ref: 'main' };

  if (inputName && link) {
    body.inputs = { [inputName]: link };
  } else if (inputName && !link) {
    // kuch workflows input optional rakhte hain — phir bhi bina link ke try karo
    // agar required hai to error aayega
  }

  btn.disabled = true;
  hn.textContent = '⏳ Workflow start ho raha hai...';

  try {
    const res = await fetch(
      `https://api.github.com/repos/${b.repo}/actions/workflows/${encodeURIComponent(b.workflow)}/dispatches`,
      {
        method: 'POST',
        headers: {
          'Authorization': 'Bearer ' + pat,
          'Accept': 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      }
    );

    if (res.status === 204) {
      hn.innerHTML = '✅ <b>Start ho gaya!</b> Status 30–60 sec baad refresh hoga. <a class="t" href="https://github.com/' + b.repo + '/actions" target="_blank">Actions dekho</a>';
    } else if (res.status === 401 || res.status === 403) {
      hn.textContent = '❌ PAT galat / expired / permission kam hai (repo + workflow chahiye)';
      localStorage.removeItem('GH_PAT');
    } else if (res.status === 404) {
      hn.textContent = '❌ Workflow ya repo nahi mila — naam check karo: ' + b.workflow;
    } else if (res.status === 422) {
      const t = await res.text();
      hn.textContent = '❌ Input missing / galat (422). Link daalo agar required hai. ' + t.slice(0, 80);
    } else {
      const t = await res.text();
      hn.textContent = '❌ Error ' + res.status + ': ' + t.slice(0, 120);
    }
  } catch (e) {
    hn.textContent = '❌ Network error: ' + e.message;
  } finally {
    btn.disabled = false;
  }
}
</script>
</body>
</html>
