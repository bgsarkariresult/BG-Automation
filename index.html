<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BG Automation | Dashboard</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Fallback so page is never pure black while loading */
  body { background: #070d1f; color: #eef4ff; margin: 0; font-family: Inter, system-ui, sans-serif; }
  #boot-msg { padding: 40px 24px; text-align: center; color: #8ba3c7; }
  #boot-msg.error { color: #ef4444; }
</style>
</head>
<body>
<div id="app-shell">
<div id="boot-msg">⏳ Dashboard load ho raha hai…</div>
<script>
/* Local helpers — no dependency on app.js globals */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => { n = +n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n)); };

const RAW = 'https://raw.githubusercontent.com/bgsarkariresult/BG-Automation/main/data/dashboard.json';
const LIVE = 'https://bg-automation-live.garhwalbhavesh2002.workers.dev/api/status';
const TREND_URL = 'https://raw.githubusercontent.com/bgtechlab/Trending-Topic-Finder/main/history.json';
const colors = ['#ef4444', '#f97316', '#2b6fff', '#8b5cf6', '#06b6d4', '#22c55e', '#ec4899', '#eab308'];

function agoText(t) {
  if (!t) return '—';
  const ms = Date.parse(t);
  if (!Number.isFinite(ms)) return '—';
  const m = Math.max(0, (Date.now() - ms) / 60000);
  return m < 1 ? 'अभी' : m < 60 ? Math.floor(m) + 'm ago' : m < 1440 ? Math.floor(m / 60) + 'h ago' : Math.floor(m / 1440) + 'd ago';
}
function timeHHMM(t) {
  if (!t) return '--:--';
  return new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
let notificationInitialized = false;
async function showBgNotification(title, options) {
  try {
    if (!("serviceWorker" in navigator)) return false;
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification(title, Object.assign({
      icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='128'><text y='90' font-size='90'>🤖</text></svg>',
      badge: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><text y='70' font-size='70'>🤖</text></svg>",
      vibrate: [120, 60, 120]
    }, options || {}));
    return true;
  } catch (e) {
    console.warn("Notification:", e);
    return false;
  }
}
let notificationInitialized = false;
async function checkWorkNotifications(runs) {
  if (!("Notification" in window) || Notification.permission !== "granted") return 0;
  const state = JSON.parse(localStorage.getItem("bg_notify_runs") || "{}");
  const next = {};
  let changes = 0;
  for (const x of runs) {
    const id = String(x.bot.repo || x.bot.id || x.name) + ":" + String(x.r.id || x.r.run_id || x.r.url || x.r.t || x.r.n || "run");
    const status = String(x.r.s || "unknown");
    next[id] = status;
    const previous = state[id];
    if (previous && previous !== status) {
      changes++;
      const label = status === "success" ? "सफल" : status === "failure" ? "असफल" : status === "cancelled" ? "रद्द" : "स्थिति बदली";
      const icon = status === "success" ? "✅" : status === "failure" ? "❌" : status === "cancelled" ? "🚫" : "🔄";
      await showBgNotification(icon + " BG Automation · " + label, {
        body: x.name + " · " + (x.r.n || "Automation job"),
        tag: "bg-" + id,
        renotify: true,
        data: { url: "logs.html" }
      });
    } else if (!previous && status === "in_progress" && notificationInitialized) {
      changes++;
      await showBgNotification("🔄 BG Automation · काम शुरू", {
        body: x.name + " · " + (x.r.n || "Automation job"),
        tag: "bg-" + id,
        data: { url: "logs.html" }
      });
    }
  }
  localStorage.setItem("bg_notify_runs", JSON.stringify(next));
  notificationInitialized = true;
  const badge = document.querySelector(".notify-badge");
  if (badge) badge.textContent = changes ? String(Math.min(changes, 9)) : "";
  return changes;
}
function enableNotifications() {
  if (!('Notification' in window)) { alert('इस ब्राउज़र में notifications उपलब्ध नहीं हैं।'); return; }
  if (Notification.permission === 'granted') { localStorage.setItem('bg_notify_enabled', '1'); alert('Notifications पहले से चालू हैं।'); return; }
  if (Notification.permission === 'denied') { alert('Browser settings में इस साइट की notifications Allow करें।'); return; }
  Notification.requestPermission().then(function (permission) {
    if (permission === 'granted') localStorage.setItem('bg_notify_enabled', '1');
    alert(permission === 'granted' ? 'Notifications चालू हो गईं। अब सभी automation status changes की सूचना मिलेगी।' : 'Notifications की अनुमति नहीं मिली।');
  });
}

function showError(msg) {
  const el = document.getElementById('boot-msg');
  if (el) { el.className = 'error'; el.innerHTML = '⚠ Error: ' + esc(msg) + '<br><small>Page refresh karke try karo.</small>'; }
  console.error(msg);
}

async function loadLocalData() {
  let d = {};
  try {
    // Same-origin JSON is normally faster than waiting on GitHub's raw CDN.
    let r = await fetch('data/dashboard.json?t=' + Date.now(), { cache: 'no-store' }).catch(() => null);
    if (!r || !r.ok) r = await fetch(RAW + '?t=' + Date.now(), { cache: 'no-store' }).catch(() => null);
    if (r && r.ok) d = await r.json();
  } catch (e) { console.warn('dashboard.json:', e); }
  return d;
}

async function loadLiveData(d) {
  try {
    const lr = await fetch(LIVE + '?t=' + Date.now(), { cache: 'no-store' });
    if (lr.ok) {
      const live = await lr.json();
      if (live && live.ok && Array.isArray(live.bots) && live.bots.length) {
        const byRepo = new Map(live.bots.map(b => [String(b.repo || '').toLowerCase(), b]));
        d.bots = (d.bots || []).map(b => {
          const fresh = byRepo.get(String(b.repo || '').toLowerCase());
          return fresh ? Object.assign({}, b, fresh, { runs: Array.isArray(fresh.runs) ? fresh.runs : b.runs }) : b;
        });
        for (const b of live.bots) {
          if (!(d.bots || []).some(x => String(x.repo || '').toLowerCase() === String(b.repo || '').toLowerCase()))
            (d.bots = d.bots || []).push(b);
        }
        d.live_updated = live.updated || live.checked_at || new Date().toISOString();
        d.live_state = 'live';
      }
    }
  } catch (e) { console.warn('live API:', e); }
  return d;
}

let lastDashboardSignature = '';

function dashboardSignature(d) {
  // Ignore timestamps that change on every poll. Re-render only when visible data/status changes.
  const x = {
    channels: d.channels || [],
    websites: d.websites || d.sites || [],
    bots: (d.bots || []).map(b => ({
      repo: b.repo, name: b.name, status: b.status, workflow: b.workflow,
      runs: (b.runs || []).slice(0, 30).map(r => ({
        id: r.id || r.run_id || r.number || r.u,
        s: r.s, n: r.n, t: r.t, u: r.u, d: r.d
      }))
    })),
    telegram: d.telegram || d.messages || []
  };
  return JSON.stringify(x);
}

function toggleTheme() {
  const dark = document.documentElement.dataset.theme !== "light";
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  localStorage.setItem("bg_theme", dark ? "light" : "dark");
}
(function restoreTheme() {
  const t = localStorage.getItem("bg_theme");
  if (t === "light") document.documentElement.dataset.theme = "light";
})();
async function loadDataFast() {
  const d = await loadLocalData();
  const fresh = await loadLiveData(d).catch(function () { return d; });
  const signature = dashboardSignature(fresh);

  if (!lastDashboardSignature || signature !== lastDashboardSignature) {
    lastDashboardSignature = signature;
    render(fresh);
  } else if (typeof checkWorkNotifications === 'function') {
    // Keep notification state alive without rebuilding the dashboard DOM.
    const bots = fresh.bots || [];
    const runs = bots.flatMap(b => (b.runs || []).map(r => ({ name: b.name || b.id || 'Bot', r, bot: b })));
    checkWorkNotifications(runs);
  }
  return fresh;
}

function stateMeta(s) {
  s = String(s || 'unknown');
  const map = {
    success:{i:'✓',l:'Success',c:'success'},
    failure:{i:'✕',l:'Failed',c:'failure'},
    in_progress:{i:'⏳',l:'Running',c:'running'},
    queued:{i:'…',l:'Queued',c:'running'},
    waiting:{i:'⏸',l:'Waiting',c:'paused'},
    pending:{i:'⏸',l:'Waiting',c:'paused'},
    cancelled:{i:'🚫',l:'Cancelled',c:'paused'},
    skipped:{i:'⏭',l:'Skipped',c:'paused'},
    timed_out:{i:'⏱',l:'Timed Out',c:'failure'},
    action_required:{i:'⚠',l:'Action Required',c:'paused'},
    requested:{i:'📨',l:'Requested',c:'running'},
    neutral:{i:'➖',l:'Neutral',c:'paused'},
    stale:{i:'🕰',l:'Stale',c:'failure'},
    startup_failure:{i:'💥',l:'Startup Failed',c:'failure'},
    completed:{i:'✓',l:'Completed',c:'success'},
    unknown:{i:'?',l:'Unknown',c:'paused'}
  };
  return map[s] || {i:'•',l:s.replace(/_/g,' '),c:'paused'};
}
function runDetail(r) {
  if (r && r.failed_step) return 'Step: ' + r.failed_step;
  if (r && r.failed_job) return 'Job: ' + r.failed_job;
  if (r && r.workflow_s && r.workflow_s !== r.s) return 'Workflow: ' + r.workflow_s.replace(/_/g,' ');
  return '';
}
function render(d) {
  try {
    d = d || {};
    const channels = d.channels || [];
    const sites = d.websites || d.sites || [];
    const bots = d.bots || [];
    const msgs = d.telegram || d.messages || [];
    const runs = bots.flatMap(b => (b.runs || []).map(r => ({ name: b.name || b.id || 'Bot', r, bot: b })))
      .sort((a, b) => new Date(b.r.t) - new Date(a.r.t));
    const recent = runs.slice(0, 30);
    const counts = runs.reduce((a,x) => { const s=String(x.r.s||'unknown'); a[s]=(a[s]||0)+1; return a; }, {});
    const success = counts.success || 0;
    const failed = counts.failure || 0;
    const running = counts.in_progress || 0;
    const queued = counts.queued || 0;
    const waiting = (counts.waiting || 0) + (counts.pending || 0);
    const cancelled = counts.cancelled || 0;
    const timedOut = counts.timed_out || 0;
    const actionRequired = counts.action_required || 0;
    const skipped = counts.skipped || 0;
    const totalRuns = d.total_runs ?? runs.length;
    const attention = failed + timedOut + actionRequired;
    checkWorkNotifications(runs);

    const chRows = channels.map((c, i) => {
      const name = c.name || c.title || 'Channel';
      const img = c.icon || c.thumb || '';
      const av = /^https?:/.test(img)
        ? '<img class="list-av" src="' + esc(img) + '" alt="">'
        : '<div class="list-av" style="background:' + colors[i % colors.length] + '">' + esc(String(name).slice(0, 2).toUpperCase()) + '</div>';
      const status = c.error ? 'paused' : 'active';
      const label = c.error ? 'Paused' : 'Active';
      return '<div class="list-row">' + av +
        '<div class="list-info"><b>' + esc(name) + '</b><small>' + esc((c.id || '').slice(0, 18) || 'YouTube') + '</small></div>' +
        '<div class="list-meta"><span class="subs">' + fmt(c.subs ?? c.subscribers) + ' subs</span><span class="badge-s ' + status + '">' + label + '</span></div></div>';
    }).join('') || '<small class="mu">No channels yet</small>';

    const siteSource = sites.length ? sites : bots.filter(b => b.site).map(b => ({ name: b.name, url: b.site, tag: b.tag }));
    const icons = ['🌐', '⚙', '▶', '🐙', '✈'];
    const siteRows = siteSource.map((s, i) => {
      const url = s.url || s.link || s.site || '';
      return '<div class="list-row">' +
        '<div class="list-av sq" style="background:' + colors[(i + 2) % colors.length] + '">' + icons[i % icons.length] + '</div>' +
        '<div class="list-info"><b>' + esc(s.name || s.title || 'Project') + '</b><small>' + esc(url.slice(0, 40) || s.tag || '') + '</small></div>' +
        '<span class="badge-s live">Live</span></div>';
    }).join('') || '<small class="mu">No websites</small>';

    const actRows = recent.slice(0, 7).map(x => {
      const m = stateMeta(x.r.s);
      const detail = runDetail(x.r);
      return '<div class="act-row"><div class="act-ico">' + m.i + '</div>' +
        '<div class="act-info"><b>' + esc(x.name) + '</b><small>' + esc(x.r.n || x.r.s || 'Workflow') + (detail ? ' · ' + esc(detail) : '') + '</small></div>' +
        '<div class="act-right"><span class="time">' + agoText(x.r.t) + '</span><span class="badge-s ' + m.c + '">' + m.l + '</span></div></div>';
    }).join('') || '<small class="mu">No recent activity</small>';

    const logLines = runs.slice(0, 6).map(x => {
      const m = stateMeta(x.r.s);
      const detail = runDetail(x.r);
      const tag = m.c === 'failure' ? 'error' : m.c === 'success' ? 'success' : 'info';
      const msg = x.r.s === 'success' ? esc(x.name) + ' completed successfully'
        : x.r.s === 'failure' ? esc(x.name) + ' failed' + (detail ? ' · ' + esc(detail) : '')
        : esc(x.name) + ' — ' + esc(m.l) + (detail ? ' · ' + esc(detail) : '');
      return '<div class="log-line"><span class="log-time">' + timeHHMM(x.r.t) + '</span><span class="log-tag ' + tag + '">[' + m.l.toUpperCase() + ']</span><span class="log-msg">' + msg + '</span></div>';
    }).join('') || '<div class="log-line"><span class="log-msg">Waiting for activity…</span></div>';

    const tgRows = msgs.slice(0, 5).map(m => {
      const text = (m.text || m.message || '').slice(0, 50);
      return '<div class="tg-row"><div class="tg-av">✈</div>' +
        '<div class="tg-info"><b>' + esc(m.from || m.bot || 'Telegram') + '</b><small>' + esc(text || 'Message') + '</small></div>' +
        '<span class="tg-time">' + agoText(m.t || m.time || m.date) + '</span></div>';
    }).join('') || '<small class="mu">No messages yet</small>';

    document.getElementById("app-shell").innerHTML =
      '<div class="top">' +
        '<button class="burger" onclick="document.querySelector(\'nav\').classList.toggle(\'open\')">☰</button>' +
        '<div class="logo"><div class="logo-bot">🤖</div><div>BG <span>Automation</span><small>AI + Automation | Grow Together</small></div></div>' +
        '<div class="goal-banner">✨ 🚀 आज का लक्ष्य: 100 नए लीड · 5 वेबसाइट अपडेट · 1 यूट्यूब वीडियो · ग्रोथ जारी रखें!</div>' +
        '<div class="top-right">' +
          '<button class="icon-btn" id="themeBtn" title="Theme" onclick="toggleTheme()">☀</button>' +
          '<button class="icon-btn" title="Enable work notifications" onclick="enableNotifications()">🔔<span class="badge notify-badge"></span></button>' +
          '<div class="user-chip"><div class="user-av">B</div> Bhavesh ▾</div>' +
        '</div>' +
      '</div>' +
      '<div class="app">' +
        '<nav>' +
          '<a class="on" href="index.html"><span class="nav-icon">⌂</span> Dashboard</a>' +
          '<a href="youtube.html"><span class="nav-icon">▶</span> YouTube Channels</a>' +
          '<a href="sites.html"><span class="nav-icon">🌐</span> Websites</a>' +
          '<a href="control.html"><span class="nav-icon">⚙</span> Actions Control</a>' +
          '<a href="logs.html"><span class="nav-icon">📋</span> Live Logs</a>' +
          '<a href="logs.html"><span class="nav-icon">✈</span> Telegram</a>' +
          '<a href="trending.html"><span class="nav-icon">🔥</span> Trending</a>' +
          '<a href="reports.html"><span class="nav-icon">💰</span> Reports</a>' +
          '<a href="https://github.com/bgsarkariresult/BG-Automation/settings/secrets/actions" target="_blank" rel="noopener"><span class="nav-icon">⚙</span> Settings</a>' +
          '<div class="nav-promo"><div class="rocket">🚀</div><b>Dream · Automate · Grow</b><small>सोचो नहीं, ऑटोमेट करो!</small><div class="ver">BG Automation v1.0</div></div>' +
          '<div class="nav-quote">"छोटे कदम भी बड़ी सफलता की ओर ले जाते हैं।"<cite>— Bhavesh</cite></div>' +
        '</nav>' +
        '<main>' +
          '<div class="kpi-row">' +
            '<div class="kpi red"><div class="kpi-top"><div class="kpi-icon">▶</div><span style="opacity:.4;font-size:18px">📊</span></div><label>Total Channels</label><div class="num">' + channels.length + '</div><div class="sub"><span>YouTube Automation</span><span class="up">↑ Active</span></div></div>' +
            '<div class="kpi purple"><div class="kpi-top"><div class="kpi-icon">⚙</div><span style="opacity:.4;font-size:18px">📈</span></div><label>Total Runs (loaded)</label><div class="num">' + totalRuns + '</div><div class="sub"><span>Automation Jobs</span><span class="up">✓ ' + success + ' · ✕ ' + failed + ' · ⏳ ' + running + '</span></div></div>' +
            '<div class="kpi blue"><div class="kpi-top"><div class="kpi-icon">✈</div><span style="opacity:.4;font-size:18px">📉</span></div><label><a href="https://t.me/bglarenup" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" title="Open Telegram channel">Telegram Messages ↗</a></label><div class="num">' + (msgs.length || '—') + '</div><div class="sub"><span>Last 7 days</span><span class="up">↑ Live</span></div></div>' +
          '</div>' +
          '<div class="dash-grid">' +
            '<div class="col">' +
              '<div class="card"><div class="hd"><h2>▶ YouTube Channels</h2><a href="youtube.html">View All →</a></div>' + chRows + '</div>' +
              '<div class="card"><div class="hd"><h2>🌐 Websites / Projects</h2><a href="sites.html">View All →</a></div>' + siteRows + '</div>' +
            '</div>' +
            '<div class="col">' +
              '<div class="card"><div class="hd"><h2>⚙ Automation Overview</h2><a href="control.html">View Details →</a></div>' +
                '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px">' +
                  '<span class="badge-s running">⏳ ' + running + ' Running</span><span class="badge-s running">… ' + queued + ' Queued</span>' +
                  '<span class="badge-s failure">✕ ' + failed + ' Failed</span>' +
                  (attention ? '<span class="badge-s paused">⚠ ' + attention + ' Attention</span>' : '<span class="badge-s success">✓ No attention needed</span>') +
                '</div>' +
                (attention ? '<div style="font-size:.78rem;padding:8px 10px;border-radius:10px;background:rgba(239,68,68,.08);margin-bottom:10px">⚠️ Failed: ' + failed + ' · Timed Out: ' + timedOut + ' · Action Required: ' + actionRequired + '</div>' : '') +
                '<div class="auto-grid">' +
                  '<div class="auto-item"><div class="ai" style="background:rgba(239,68,68,.12)">▶</div><b>YouTube</b><small>' + channels.length + ' Channels</small><div class="bar r"><i></i></div><div class="bar-pct">100%</div></div>' +
                  '<div class="auto-item"><div class="ai" style="background:rgba(139,92,246,.12)">🌐</div><b>Websites</b><small>' + (sites.length || bots.filter(function(b){return b.site}).length) + ' Projects</small><div class="bar p"><i></i></div><div class="bar-pct">100%</div></div>' +
                  '<div class="auto-item"><div class="ai" style="background:rgba(34,211,238,.12)">✈</div><b>Telegram</b><small>Telegram</small><div class="bar c"><i></i></div><div class="bar-pct">100%</div></div>' +
                  '<div class="auto-item"><div class="ai" style="background:rgba(245,158,11,.12)">🐙</div><b>GitHub</b><small>' + bots.length + ' Repo' + (bots.length !== 1 ? 's' : '') + '</small><div class="bar a"><i></i></div><div class="bar-pct">' + (failed ? Math.max(0, 100 - failed * 10) : 100) + '%</div></div>' +
                '</div>' +
              '</div>' +
              '<div class="card"><div class="hd"><h2>🕐 Recent Activity</h2><a href="logs.html">View All →</a></div>' +
                '<div style="font-size:.72rem;color:var(--mu);margin-bottom:6px">All workflow states</div>' +
                '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">' +
                  '<span class="badge-s success">✓ ' + (counts.success || 0) + ' Success</span>' +
                  '<span class="badge-s failure">✕ ' + (counts.failure || 0) + ' Failed</span>' +
                  '<span class="badge-s running">⏳ ' + (counts.in_progress || 0) + ' Running</span>' +
                  '<span class="badge-s running">… ' + (counts.queued || 0) + ' Queued</span>' +
                  '<span class="badge-s paused">⏸ ' + ((counts.waiting||0)+(counts.pending||0)) + ' Waiting/Pending</span>' +
                  '<span class="badge-s paused">🚫 ' + (counts.cancelled || 0) + ' Cancelled</span>' +
                  '<span class="badge-s paused">⏭ ' + (counts.skipped || 0) + ' Skipped</span>' +
                  '<span class="badge-s failure">⏱ ' + (counts.timed_out || 0) + ' Timed Out</span>' +
                  '<span class="badge-s paused">⚠ ' + (counts.action_required || 0) + ' Action Required</span>' +
                  '<span class="badge-s running">📨 ' + (counts.requested || 0) + ' Requested</span>' +
                  '<span class="badge-s paused">➖ ' + (counts.neutral || 0) + ' Neutral</span>' +
                  '<span class="badge-s failure">🕰 ' + (counts.stale || 0) + ' Stale</span>' +
                  '<span class="badge-s failure">💥 ' + (counts.startup_failure || 0) + ' Startup Failed</span>' +
                '</div>' +
                actRows + '</div>' +
            '</div>' +
            '<div class="col">' +
              '<div class="card"><div class="hd"><h2>🔥 Trending Topics</h2><a href="trending.html">View All →</a></div><div id="trendBox"><small class="mu">Loading…</small></div></div>' +
              '<div class="card"><div class="hd"><h2>📋 Live Logs</h2><span class="live-dot">Live</span></div>' + logLines +
                '<div style="text-align:right;margin-top:8px"><a href="logs.html" style="font-size:.75rem;color:var(--ac2);font-weight:600">View All Logs →</a></div></div>' +
              '<div class="card"><div class="hd"><h2>✈ Recent Telegram Messages</h2><a href="logs.html">View All →</a></div>' + tgRows + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="footer">' +
            '<div><b style="color:var(--ac2)">BG</b> Automation · AI + Automation | Grow Together</div>' +
            '<div class="footer-links"><a href="https://github.com/bgsarkariresult/BG-Automation" target="_blank" rel="noopener">🐙 GitHub</a><a href="logs.html">✈ Telegram</a><a href="youtube.html">▶ YouTube</a><a href="sites.html">🌐 Website</a></div>' +
            '<div class="status-ok">' + (d.live_state === 'live' && !attention ? '● Systems Operational' : attention ? '⚠ Attention Required' : '● Dashboard Online') + '</div>' +
          '</div>' +
        '</main>' +
      '</div>';

    loadTrends();
  } catch (e) {
    showError(e && e.message ? e.message : String(e));
  }
}

async function loadTrends() {
  const box = document.getElementById('trendBox');
  if (!box) return;
  try {
    const r = await fetch(TREND_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const rows = [];
    Object.keys(data || {}).forEach(function (channel) {
      const group = data[channel];
      if (!group) return;
      const list = Array.isArray(group.latest) ? group.latest : (Array.isArray(group.suggested) ? group.suggested : []);
      list.forEach(function (t) { rows.push(Object.assign({}, t, { channel: channel, updated_at: t.fetched_at || group.updated_at || '' })); });
    });
    const seen = {};
    const top = rows.filter(function (t) { return t && t.title; }).filter(function (t) {
      const k = String(t.title).trim().toLowerCase();
      if (seen[k]) return false; seen[k] = 1; return true;
    }).sort(function (a, b) { return (+b.score || 0) - (+a.score || 0); }).slice(0, 5);

    box.innerHTML = top.length ? top.map(function (t, i) {
      return '<div class="trend-item"><div class="trend-num n' + (i + 1) + '">' + (i + 1) + '</div>' +
        '<div class="trend-info"><b>' + esc(t.title) + '</b><small>' + esc(t.source || t.channel || 'trend') +
        (Number.isFinite(+t.score) ? ' · ' + Math.round(+t.score) + ' score' : '') + '</small></div>' +
        '<span class="trend-up">↑</span></div>';
    }).join('') : '<small class="mu">No trending data</small>';
  } catch (e) {
    box.innerHTML = '<small class="mu">Trending unavailable · <a href="trending.html" style="color:var(--ac2)">Open →</a></small>';
  }
}

loadDataFast().catch(function (e) {
  showError(e && e.message ? e.message : 'Load failed');
  render({});
});
setInterval(function () {
  if (!document.hidden) loadDataFast().catch(function () {});
}, 45000);
</script>
