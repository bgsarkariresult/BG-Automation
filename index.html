<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BG Automation | Dashboard</title>
<style>
:root{--bg:#070d1c;--surface:#0d1830;--surface2:#101f3d;--line:#203456;--text:#edf3ff;--muted:#91a4c5;--blue:#3984ff;--cyan:#29c8e8;--green:#25d6a0;--red:#ff657d;--amber:#ffbd58}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 45% -15%,#142750 0,transparent 46%),var(--bg);color:var(--text);font:13px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif}
a{color:inherit;text-decoration:none}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:11px 22px;min-height:72px;background:rgba(8,17,36,.94);border-bottom:1px solid #1c3153;backdrop-filter:blur(14px)}
.logo{font-size:21px;font-weight:800;letter-spacing:-.45px;white-space:nowrap}.logo small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.2px}
.topnav{display:flex;align-items:center;gap:5px;margin:auto}.topnav a{padding:9px 12px;border-radius:9px;color:#c1cfe7;white-space:nowrap;transition:.15s}.topnav a:hover,.topnav a.on{background:#17376b;color:#fff}
.topright{display:flex;align-items:center;gap:9px;white-space:nowrap}.status{font-size:10px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}.status b{display:block;color:var(--green);font-size:11px}.status b:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 9px #25d6a088}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#287bff,#18b7df);font-weight:800;color:#fff}
.burger{display:none;background:none;border:0;color:var(--text);font-size:22px;cursor:pointer}.refresh-btn{border:1px solid #285bb0;background:#14366d;color:#eaf2ff;border-radius:8px;padding:8px 11px;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.15s}.refresh-btn:hover{background:#1c4b91}.refresh-btn:disabled{opacity:.6;cursor:wait}
.app{display:grid;grid-template-columns:205px minmax(0,1fr);gap:17px;padding:17px 19px;max-width:1800px;margin:auto;min-height:calc(100vh - 72px)}
nav{display:flex;flex-direction:column;gap:5px;min-width:0;align-self:stretch}nav>a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:#b9c8e2;font-size:12px;transition:background .15s,color .15s}nav>a.on,nav>a:hover{background:linear-gradient(100deg,#1765d7,#17418a);color:#fff;box-shadow:inset 3px 0 #38c8f3}nav .cnt{margin-left:auto;background:#1a3156;border:1px solid #29466e;border-radius:12px;padding:1px 7px;font-size:10px}nav .sys{margin-top:auto;padding:12px;border:1px solid var(--line);background:linear-gradient(145deg,#101e3a,#0b162d);border-radius:10px}nav .sys b{color:var(--green);font-size:11px}nav small{color:var(--muted);font-size:10px}
main{min-width:0}
.dg{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1.12fr) minmax(265px,.88fr);grid-template-areas:"stats stats trending" "youtube automation logs" "websites activity telegram" "status status status";gap:13px;align-items:start}
.dg>.col{display:contents}.two{display:contents}.wel{display:none!important}
.stats{grid-area:stats;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dg>.col:first-child>.card:nth-of-type(3){grid-area:youtube}.dg>.col:first-child>.card:nth-of-type(4){grid-area:websites}.dg>.col:first-child>.two>section:first-child{grid-area:automation}.dg>.col:first-child>.two>section:last-child{grid-area:activity}.dg>.col:last-child>.card:nth-of-type(1){grid-area:trending}.dg>.col:last-child>.card:nth-of-type(2){grid-area:logs}.dg>.col:last-child>.card:nth-of-type(3){grid-area:telegram}.dg>.col:last-child>.okbox{grid-area:status}
.card,.stat{background:linear-gradient(150deg,rgba(16,31,59,.98),rgba(10,21,42,.98));border:1px solid #20395e;border-radius:11px;padding:13px;min-width:0;box-shadow:0 7px 22px rgba(0,0,0,.13)}
.card{transition:border-color .15s,transform .15s}.card:hover{border-color:#315787}
.stat{display:grid;grid-template-columns:42px 1fr;gap:4px 10px;align-items:center;padding:13px 14px;min-height:91px}.ico{grid-row:span 2;width:41px;height:41px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:#17376f}.stat small{color:#aebfdb;font-size:11px}.stat strong{font-size:25px;line-height:1.1;letter-spacing:-.5px}.sub{grid-column:1/-1;color:var(--muted);font-size:10px;margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;padding-bottom:9px;border-bottom:1px solid #1d3455}.hd h2{font-size:14px;margin:0;font-weight:700;letter-spacing:.05px}.btn{display:inline-block;background:#1859ba;border:1px solid #2d69c6;border-radius:7px;padding:5px 9px;color:#f5f8ff;font-size:10px;font-weight:600;white-space:nowrap}.btn:hover{background:#246dd7}.btn.alt{background:#11264a;border-color:#29466e}
.yt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.yt-card{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;background:#0a152b;border:1px solid #1e3455;border-radius:9px;padding:10px 7px;min-width:0}.yt-card img,.av{width:39px;height:39px;border-radius:50%;object-fit:cover;background:#194f9b;display:grid;place-items:center;font-weight:800}.yt-card b{font-size:11px}.id{font-size:9px;color:var(--muted);overflow-wrap:anywhere}.chip{font-size:9px;border-radius:13px;padding:2px 8px;color:var(--green);background:#0c2d2a;border:1px solid #165747}.chip.e{color:var(--red);background:#2a141d;border-color:#633044}.nums{display:flex;gap:8px;color:var(--muted);font-size:9px}.manage{width:100%;padding:5px;border-radius:6px;background:#12284b;border:1px solid #29466e;font-size:9px}.manage:hover{background:#1a3c70}
.ws-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px}.ws-card{display:grid;gap:6px;background:#0a152b;border:1px solid #1e3455;border-radius:9px;padding:10px;min-width:0}.site-head{display:flex;align-items:center;gap:8px}.site-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:#17418d}.url{font-size:9px;color:#76b7ff;overflow-wrap:anywhere}.meta{font-size:9px;color:var(--muted)}.actions{display:flex;gap:6px}.actions a{flex:1;text-align:center;padding:5px;border:1px solid #29466e;border-radius:6px;background:#12284b;font-size:9px}.actions a.primary{background:#1859ba;border-color:#2d69c6}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.k{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.k div{background:#0a152b;border:1px solid #1e3455;border-radius:8px;padding:8px;text-align:center}.k b{display:block;font-size:18px}.ok{color:var(--green)}.err{color:var(--red)}.warn{color:var(--amber)}
.li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1c3150;min-width:0}.li:last-child{border:0}.dot{width:23px;height:23px;flex-shrink:0;border-radius:7px;background:#142750;display:grid;place-items:center;font-size:11px}.dot.success{color:var(--green)}.dot.failure{color:var(--red)}.li b{font-size:10px}.li small{display:block;font-size:9px;color:var(--muted)}.time{margin-left:auto;color:var(--muted);font-size:9px;white-space:nowrap}.qa a{display:flex;justify-content:space-between;align-items:center;padding:9px;border:1px solid #244477;background:#10234c;border-radius:8px;margin-bottom:7px;font-size:11px;font-weight:600}.qa a:hover{background:#173875}.logs{max-height:270px;overflow:auto}.okbox{border:1px solid #176e60;background:#0b2929;border-radius:9px;padding:10px;color:#4be0b4;font-size:11px;font-weight:700}
.trend-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1c3150;min-width:0}.trend-row:last-child{border-bottom:0}.trend-rank{width:24px;height:24px;border-radius:7px;background:#142750;display:grid;place-items:center;font-size:10px;font-weight:800;flex-shrink:0}.trend-title{min-width:0;flex:1}.trend-title b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trend-title small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.trend-score{font-size:9px;color:#ffae69;background:#2a1b16;border-radius:12px;padding:3px 6px;white-space:nowrap}
@media(max-width:1180px){.app{grid-template-columns:175px minmax(0,1fr);gap:12px;padding:12px}.dg{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 245px;gap:10px}.top{gap:10px;padding:10px 14px}.topnav a{padding:8px 9px;font-size:11px}}
@media(max-width:940px){.dg{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"stats stats" "youtube automation" "websites activity" "trending logs" "telegram telegram" "status status"}.app{grid-template-columns:160px minmax(0,1fr)}.topnav{display:none}}
@media(max-width:680px){.top{padding:9px 12px;gap:9px;min-height:58px}.burger{display:block}.logo{font-size:17px}.logo small{font-size:9px}.topright{margin-left:auto;gap:7px}.status{font-size:9px;padding-left:8px}.avatar{width:30px;height:30px}.app{display:block;padding:10px}.dg{grid-template-columns:1fr;grid-template-areas:"stats" "youtube" "websites" "automation" "activity" "trending" "logs" "telegram" "status";gap:10px}.app nav{position:fixed;inset:0 22% 0 0;z-index:30;background:var(--surface);padding:62px 12px 12px;transform:translateX(-110%);transition:transform .2s;overflow:auto;border-right:1px solid var(--line)}nav.open{transform:translateX(0)}.col{gap:10px}.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.stat{padding:9px;grid-template-columns:30px 1fr;gap:4px 6px;min-height:75px}.ico{width:29px;height:29px;font-size:14px;border-radius:8px}.stat strong{font-size:19px}.stat small{font-size:9px}.sub{font-size:8px}.card{padding:11px}.hd h2{font-size:13px}.two{grid-template-columns:1fr}.yt-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.ws-grid{grid-template-columns:1fr}}
@media(max-width:390px){.stats{grid-template-columns:1fr}.status{display:none}.refresh-btn{padding:6px 8px;font-size:9px}}
</style>
</head>
<body>
<script src="app.js"></script>
<script>
function clockText(){return new Date().toLocaleString('hi-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
boot('index.html','YouTube • GitHub • Telegram • All Projects',d=>{
 const channels=d.channels||[],sites=d.websites||d.sites||[],bots=d.bots||[];
 const runs=bots.flatMap(b=>(b.runs||[]).map(r=>({name:b.name||b.id||'Automation',r}))).sort((a,b)=>new Date(b.r.t)-new Date(a.r.t));
 const recent=runs.filter(x=>x.r.d>=60||x.r.s==='failure');
 const today=new Date().toLocaleDateString('en-CA');
 const todayRuns=recent.filter(x=>new Date(x.r.t).toLocaleDateString('en-CA')===today).length;
 const success=recent.filter(x=>x.r.s==='success').length,failed=recent.filter(x=>x.r.s==='failure').length;
 const messages=(d.telegram||d.messages||[]).length;
 const agoText=t=>{if(!t)return'—';let m=Math.max(0,(Date.now()-new Date(t))/60000);return m<1?'अभी':m<60?Math.round(m)+' मिनट पहले':m<1440?Math.round(m/60)+' घंटे पहले':Math.round(m/1440)+' दिन पहले'};
 const row=x=>`<div class="li"><span class="dot ${x.r.s}">${x.r.s==='success'?'✓':x.r.s==='failure'?'✕':'…'}</span><div><b>${esc(x.name)}</b><small>${esc(x.r.s||'unknown')} · ${Math.ceil((+x.r.d||0)/60)} मिनट</small></div><span class="time">${agoText(x.r.t)}</span></div>`;
 const top=document.querySelector('.top');
 top.innerHTML=`<button class="burger" aria-label="Menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button><div class="logo"><span style="color:#20baff">⚙ BG</span> Automation<small>Automate　•　Create　•　Grow</small></div><div class="topnav"><a class="on" href="index.html">⌂　Home</a><a href="youtube.html">▶　YouTube</a><a href="https://github.com/bgsarkariresult/BG-Automation" target="_blank" rel="noopener">◉　GitHub</a><a href="logs.html">➤　Telegram</a><a href="sites.html">▦　All Projects</a></div><div class="topright"><button id="refreshBtn" class="refresh-btn" onclick="window.refreshDashboard&&window.refreshDashboard()" title="नया उपलब्ध डेटा लोड करें">↻ Refresh</button><button id="runSyncBtn" class="refresh-btn" onclick="window.runDashboardSync&&window.runDashboardSync()" title="Cloudflare Worker से GitHub Sync शुरू करें">▶ Run Sync</button><div class="status"><b>System Online</b><span id="clock">${clockText()}</span></div><div class="avatar">BG</div></div>`;
 const nav=document.querySelector('nav');
 nav.innerHTML=`<a class="on" href="index.html">⌂　Dashboard</a><a href="youtube.html">▶　YouTube Channels <span class="cnt">${channels.length}</span></a><a href="sites.html">▣　Websites / Projects</a><a href="trending.html">🔥　Trending-Topic</a><a href="control.html">⚙　Automation</a><a href="logs.html">▤　Activity Logs</a><a href="logs.html">➤　Telegram Messages <span class="cnt">${messages}</span></a><a href="https://github.com/bgsarkariresult/BG-Automation/settings/secrets/actions" target="_blank" rel="noopener">⚙　Settings</a><div class="sys"><b>● System Online</b><br><small>Last checked: ${clockText()}</small><br><small>Data updated: ${at(d.live_updated||d.updated)}</small></div>`;
 const channelCard=c=>{const name=c.name||c.title||c.id||'Channel',img=c.icon||c.thumb||c.thumbnail||c.img||'',avatar=/^https?:/.test(img)?`<img src="${esc(img)}" alt="">`:`<div class="av">${esc(String(name).slice(0,2).toUpperCase())}</div>`;return `<div class="yt-card">${avatar}<b>${esc(name)}</b><div class="id">${esc((c.id||'—').slice(0,16))}</div><span class="chip ${c.error?'e':''}">${c.error?'Error':'● Active'}</span><div class="nums"><span>👁 ${fmt(c.views??c.viewCount)}</span><span>👥 ${fmt(c.subs??c.subscribers)}</span></div><a class="manage" href="youtube.html">Manage</a></div>`};
 const siteCard=x=>{const url=x.url||x.link||'';return `<div class="ws-card"><div class="site-head"><div class="site-icon">🌐</div><b>${esc(x.name||x.title||'Website')}</b></div><div class="url">${esc(url)}</div><div class="meta">Updated: ${agoText(x.updated||d.updated)}</div><div class="actions"><a href="sites.html">Manage</a>${url?`<a class="primary" href="${esc(url)}" target="_blank" rel="noopener">Open ↗</a>`:''}</div></div>`};
 document.querySelector('#main').innerHTML=`<div class="dg"><div class="col">
 <section class="card wel"><div><h2>👋 <span>Welcome Back,</span> Bhavesh!</h2><p>Your YouTube, Websites and Automation are running smoothly.</p><small>Keep creating, keep growing. 🚀</small></div><span class="live">● Live</span></section>
 <section class="stats"><div class="stat"><div class="ico" style="background:#e11d4825;color:#fb7185">▶</div><div><small>Total Channels</small><strong>${channels.length}</strong></div><div class="sub">YouTube Automation</div></div><div class="stat"><div class="ico" style="background:#7c3aed25;color:#b69aff">⚙</div><div><small>Total Runs</small><strong>${todayRuns}</strong></div><div class="sub">Automation Jobs · Today</div></div><div class="stat"><div class="ico" style="background:#0891b225;color:#38bdf8">➤</div><div><small>Telegram Messages</small><strong>${messages||'—'}</strong></div><div class="sub">Available messages</div></div></section>
 <section class="card"><div class="hd"><h2>▶ YouTube Channels</h2><a class="btn" href="youtube.html">View All →</a></div><div class="yt-grid">${channels.slice(0,8).map(channelCard).join('')||'<small>No channel found.</small>'}<a class="yt-card" href="youtube.html"><b style="font-size:25px">＋</b><b>Add New Channel</b><small>Manage channels</small></a></div></section>
 <section class="card"><div class="hd"><h2>🌐 Websites / Projects</h2><a class="btn alt" href="sites.html">View All →</a></div><div class="ws-grid">${sites.slice(0,6).map(siteCard).join('')||'<small>No website found.</small>'}</div></section>
 <div class="two"><section class="card"><div class="hd"><h2>⚙ Automation Overview</h2><a class="btn alt" href="control.html">Details →</a></div><div class="k"><div><small>Total Jobs</small><b>${recent.length}</b></div><div class="ok"><small>Success</small><b>${success}</b></div><div class="err"><small>Failed</small><b>${failed}</b></div><div class="warn"><small>Running</small><b>${bots.filter(b=>['in_progress','queued'].includes(b.status)).length}</b></div></div></section><section class="card"><div class="hd"><h2>🕒 Recent Activity</h2><a class="btn alt" href="logs.html">View All →</a></div>${recent.slice(0,4).map(row).join('')||'<small>No recent activity.</small>'}</section></div>
 </div><div class="col"><section class="card"><div class="hd"><h2>🔥 Trending Topics</h2><a class="btn alt" href="trending.html">View All →</a></div><div id="dashTrending"><small>Trending topics लोड हो रहे हैं…</small></div></section>
 <section class="card"><div class="hd"><h2>⌁ Live Logs</h2><span class="live">● Live</span></div><div class="logs">${recent.slice(0,7).map(row).join('')||'<small>No logs available.</small>'}</div><div style="text-align:right;margin-top:8px"><a class="btn alt" href="logs.html">View All Logs →</a></div></section><section class="card"><div class="hd"><h2>➤ Recent Telegram Messages</h2><a class="btn alt" href="logs.html">View All →</a></div>${(d.telegram||d.messages||[]).slice(0,4).map(m=>`<div class="li"><span class="dot">➤</span><div><b>${esc(m.title||m.name||m.text||'Telegram update')}</b><small>${esc(m.message||m.status||'')}</small></div></div>`).join('')||'<small>No Telegram messages in dashboard data.</small>'}</section><div class="okbox">${failed?'⚠ Historical failed jobs: '+failed:'✓ No failed jobs in loaded history'}<small style="display:block;font-weight:400;margin-top:3px">${d.live_state==='live'?'Cloudflare Live · ':'Dashboard cached · '}${at(d.live_updated||d.updated)}</small></div></div></div>`;
});
async function runDashboardSync(){
 const btn=document.querySelector('#runSyncBtn');
 if(!btn||btn.disabled)return;
 btn.disabled=true;btn.textContent='⏳ Starting…';
 const oldUpdated=window.D?.updated||'';
 const status=document.querySelector('.okbox');
 if(status)status.innerHTML='⏳ GitHub Actions sync शुरू हो रहा है…';
 try{
  const response=await fetch('https://bg-runf.garhwalbhavesh2002.workers.dev/',{
   method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({repo:'bgsarkariresult/BG-Automation',workflow:'sync.yml',ref:'main'})
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok||!result.ok)throw new Error(result.error||('Worker error: '+response.status));
  btn.textContent='⏳ Sync चल रहा है…';
  if(status)status.innerHTML='⏳ GitHub Actions शुरू हो गया। डेटा अपडेट होने की प्रतीक्षा…';
  const deadline=Date.now()+240000;
  let updated=false;
  while(Date.now()<deadline){
   await new Promise(resolve=>setTimeout(resolve,8000));
   try{
    const r=await fetch('https://raw.githubusercontent.com/bgsarkariresult/BG-Automation/main/data/dashboard.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){const d=await r.json();if(d.updated&&d.updated!==oldUpdated){updated=true;await window.refreshDashboard?.();break}}
   }catch(_){}
  }
  if(status)status.innerHTML=updated?'✓ Sync पूरा हुआ। Data updated: '+new Date(window.D?.updated||Date.now()).toLocaleString('hi-IN'):'⏳ Sync शुरू हो गया है। डेटा अपडेट होने में अधिक समय लग रहा है; कुछ देर बाद Refresh करें।';
 }catch(e){
  if(status)status.textContent='⚠ Sync शुरू नहीं हुआ: '+(e.message||'Worker से संपर्क नहीं हो पाया');
 }finally{btn.disabled=false;btn.textContent='▶ Run Sync'}
}
setInterval(()=>{const el=document.querySelector('#clock');if(el)el.textContent=clockText()},30000);
</script>
<script>
(async function loadDashboardTrending(){
 // boot() inserts the dashboard after its async data fetch; wait for the card.
 let box=document.querySelector('#dashTrending');
 if(!box){
  await new Promise(resolve=>{
   const observer=new MutationObserver(()=>{
    box=document.querySelector('#dashTrending');
    if(box){observer.disconnect();resolve();}
   });
   observer.observe(document.body,{childList:true,subtree:true});
   // Avoid leaving an observer behind if the dashboard cannot render.
   setTimeout(()=>{observer.disconnect();resolve();},15000);
  });
 }
 if(!box)return;
 const url='https://raw.githubusercontent.com/bgtechlab/Trending-Topic-Finder/main/history.json';
 try{
  const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const data=await r.json(),rows=[];
  Object.entries(data||{}).forEach(([channel,group])=>{
   if(!group)return;
   const list=Array.isArray(group.latest)?group.latest:(Array.isArray(group.suggested)?group.suggested:[]);
   list.forEach(t=>rows.push({...t,channel,updated_at:t.fetched_at||group.updated_at||''}));
  });
  const seen=new Set();
  const top=rows.filter(t=>t&&t.title).filter(t=>{
    const k=String(t.title).trim().toLowerCase();
    if(seen.has(k))return false;seen.add(k);return true;
  }).sort((a,b)=>new Date(b.updated_at||0)-new Date(a.updated_at||0)).slice(0,8);
  box.innerHTML=top.length?'<small class="meta">Latest saved results · '+esc(top[0].updated_at?new Date(top[0].updated_at).toLocaleString('hi-IN'):'update time unavailable')+'</small>'+top.map((t,i)=>{
   const title=esc(t.title),score=Number.isFinite(+t.score)?Math.round(+t.score):'—',source=esc(t.source||'unknown'),link=esc(t.url||'#');
   return '<a href="'+link+'" target="_blank" rel="noopener" class="trend-row"><span class="trend-rank">'+(i+1)+'</span><span class="trend-title"><b>'+title+'</b><small>'+source+' · '+esc(t.channel||'')+'</small></span><span class="trend-score">Score '+score+'</span></a>';
  }).join(''):'<small>अभी कोई नवीनतम ट्रेंड उपलब्ध नहीं है।</small>';
 }catch(e){
  box.innerHTML='<small>Live trending data उपलब्ध नहीं है। <a href="trending.html" style="color:#64a9ff">Trending page खोलें →</a></small>';
 }
})();
</script>
</body>
</html>
