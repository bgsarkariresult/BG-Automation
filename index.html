<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BG Automation | Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #060b16;
  --bg2: #0a1224;
  --surface: #0d1629;
  --surface2: #121e36;
  --surface3: #182744;
  --border: rgba(56, 110, 180, 0.28);
  --border-hover: rgba(80, 150, 255, 0.45);
  --text: #f0f5ff;
  --muted: #8ba0c0;
  --muted2: #6b7f9e;
  --blue: #3b8aff;
  --blue2: #1a6ef0;
  --cyan: #22d3ee;
  --green: #22d3a0;
  --red: #ff6b81;
  --amber: #fbbf24;
  --purple: #a78bfa;
  --glow-blue: rgba(59, 138, 255, 0.15);
  --glow-green: rgba(34, 211, 160, 0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.35);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background:
    radial-gradient(ellipse 80% 50% at 70% -10%, rgba(40, 100, 220, 0.12), transparent 50%),
    radial-gradient(ellipse 60% 40% at 10% 60%, rgba(20, 180, 200, 0.06), transparent 45%),
    var(--bg);
  color: var(--text);
  font: 14px/1.55 "Inter", "Noto Sans Devanagari", system-ui, -apple-system, sans-serif;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ─── TOP BAR ─── */
.top {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  padding: 0 24px; height: 64px;
  background: rgba(6, 11, 22, 0.85);
  backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 800; letter-spacing: -0.4px; white-space: nowrap;
}
.logo-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: linear-gradient(135deg, #3b8aff, #22d3ee);
  display: grid; place-items: center; font-size: 16px;
  box-shadow: 0 4px 16px rgba(59, 138, 255, 0.35);
}
.logo small { display: block; font-size: 10px; font-weight: 500; color: var(--muted); letter-spacing: 0.3px; margin-top: 1px; }

.topnav { display: flex; align-items: center; gap: 4px; margin: 0 auto; }
.topnav a {
  padding: 7px 14px; border-radius: 8px;
  color: var(--muted); font-size: 13px; font-weight: 500;
  transition: all 0.15s;
}
.topnav a:hover, .topnav a.on { background: rgba(59, 138, 255, 0.12); color: #fff; }

.topright { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.btn-top {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 14px; border-radius: 8px;
  font-size: 12px; font-weight: 600;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  transition: all 0.15s;
}
.btn-top:hover { background: var(--surface3); border-color: var(--border-hover); }
.btn-top.primary {
  background: linear-gradient(135deg, #3b8aff, #1a6ef0);
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(59, 138, 255, 0.3);
}
.btn-top.primary:hover { box-shadow: 0 6px 20px rgba(59, 138, 255, 0.4); transform: translateY(-1px); }
.btn-top:disabled { opacity: 0.55; cursor: wait; transform: none !important; }

.status-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 20px;
  background: rgba(34, 211, 160, 0.08);
  border: 1px solid rgba(34, 211, 160, 0.25);
  font-size: 11px; color: var(--muted);
}
.status-pill .dot-live {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}
.avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #3b8aff, #22d3ee);
  display: grid; place-items: center;
  font-weight: 800; font-size: 12px; color: #fff;
}
.burger { display: none; font-size: 22px; padding: 4px; }

/* ─── LAYOUT ─── */
.app {
  display: grid;
  grid-template-columns: 220px minmax(0, 1fr);
  gap: 20px;
  padding: 20px 24px;
  max-width: 1600px;
  margin: 0 auto;
  min-height: calc(100vh - 64px);
}

/* ─── SIDEBAR ─── */
nav {
  display: flex; flex-direction: column; gap: 3px;
  position: sticky; top: 84px; align-self: start;
  padding: 12px 10px;
  background: linear-gradient(180deg, rgba(13, 22, 41, 0.95), rgba(10, 18, 36, 0.95));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
nav > a {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-sm);
  color: var(--muted); font-size: 13px; font-weight: 500;
  transition: all 0.15s;
}
nav > a:hover { background: rgba(59, 138, 255, 0.08); color: var(--text); }
nav > a.on {
  background: linear-gradient(135deg, rgba(59, 138, 255, 0.2), rgba(26, 110, 240, 0.12));
  color: #fff;
  box-shadow: inset 3px 0 0 var(--cyan);
}
nav .cnt {
  margin-left: auto;
  background: var(--surface3);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1px 8px;
  font-size: 11px; font-weight: 600;
  color: var(--muted);
}
nav .sys {
  margin-top: auto;
  padding: 14px;
  border-radius: var(--radius-sm);
  background: linear-gradient(145deg, rgba(20, 40, 70, 0.6), rgba(10, 20, 40, 0.6));
  border: 1px solid var(--border);
  font-size: 11px;
}
nav .sys b { color: var(--green); font-size: 12px; }
nav .sys small { color: var(--muted2); display: block; margin-top: 4px; }

/* ─── MAIN ─── */
main { min-width: 0; }

/* Welcome banner */
.welcome {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 20px 24px;
  margin-bottom: 18px;
  border-radius: var(--radius);
  background: linear-gradient(135deg, rgba(30, 80, 180, 0.18), rgba(20, 50, 120, 0.08));
  border: 1px solid rgba(59, 138, 255, 0.2);
  position: relative; overflow: hidden;
}
.welcome::before {
  content: "";
  position: absolute; top: -40%; right: -5%;
  width: 200px; height: 200px;
  background: radial-gradient(circle, rgba(59, 138, 255, 0.15), transparent 70%);
  pointer-events: none;
}
.welcome h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
.welcome p { color: var(--muted); font-size: 13px; margin-top: 4px; }
.welcome-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* Stats row */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 18px;
}
.stat {
  display: flex; align-items: center; gap: 14px;
  padding: 18px;
  border-radius: var(--radius);
  background: linear-gradient(145deg, rgba(13, 22, 41, 0.95), rgba(10, 18, 36, 0.95));
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: border-color 0.2s, transform 0.2s;
}
.stat:hover { border-color: var(--border-hover); transform: translateY(-2px); }
.stat-ico {
  width: 48px; height: 48px; border-radius: 14px;
  display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
}
.stat-ico.blue { background: rgba(59, 138, 255, 0.12); }
.stat-ico.green { background: rgba(34, 211, 160, 0.12); }
.stat-ico.amber { background: rgba(251, 191, 36, 0.12); }
.stat-ico.purple { background: rgba(167, 139, 250, 0.12); }
.stat-ico.cyan { background: rgba(34, 211, 238, 0.12); }
.stat-ico.red { background: rgba(255, 107, 129, 0.12); }
.stat small { color: var(--muted); font-size: 12px; font-weight: 500; display: block; }
.stat strong { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1.15; display: block; }
.stat .sub { color: var(--muted2); font-size: 11px; margin-top: 2px; }

/* Grid layout */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr 320px;
  gap: 16px;
  align-items: start;
}

/* Cards */
.card {
  background: linear-gradient(145deg, rgba(13, 22, 41, 0.95), rgba(10, 18, 36, 0.95));
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--border-hover); }

.hd {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 14px; padding-bottom: 12px;
  border-bottom: 1px solid rgba(56, 110, 180, 0.15);
}
.hd h2 { font-size: 15px; font-weight: 700; letter-spacing: -0.1px; display: flex; align-items: center; gap: 8px; }
.hd h2 .ico { font-size: 16px; }

.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 12px; border-radius: 8px;
  font-size: 11px; font-weight: 600;
  background: linear-gradient(135deg, #3b8aff, #1a6ef0);
  color: #fff; border: none;
  transition: all 0.15s;
  box-shadow: 0 3px 10px rgba(59, 138, 255, 0.2);
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(59, 138, 255, 0.3); }
.btn.alt {
  background: var(--surface2);
  border: 1px solid var(--border);
  box-shadow: none;
  color: var(--muted);
}
.btn.alt:hover { background: var(--surface3); color: var(--text); }

/* YouTube channels */
.yt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 10px;
}
.yt-card {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center;
  padding: 14px 10px;
  border-radius: 12px;
  background: var(--surface2);
  border: 1px solid rgba(56, 110, 180, 0.18);
  transition: all 0.2s;
}
.yt-card:hover {
  transform: translateY(-3px);
  border-color: var(--blue);
  box-shadow: 0 8px 24px rgba(59, 138, 255, 0.15);
}
.yt-card img, .av {
  width: 44px; height: 44px; border-radius: 50%;
  object-fit: cover;
  background: linear-gradient(135deg, #3b8aff, #1a6ef0);
  display: grid; place-items: center;
  font-weight: 800; font-size: 14px; color: #fff;
  box-shadow: 0 0 0 3px rgba(59, 138, 255, 0.12);
}
.yt-card b { font-size: 12px; font-weight: 600; }
.yt-card .id { font-size: 9px; color: var(--muted2); word-break: break-all; }
.chip {
  font-size: 10px; font-weight: 600;
  border-radius: 20px; padding: 2px 10px;
  color: var(--green);
  background: rgba(34, 211, 160, 0.1);
  border: 1px solid rgba(34, 211, 160, 0.25);
}
.chip.e {
  color: var(--red);
  background: rgba(255, 107, 129, 0.1);
  border-color: rgba(255, 107, 129, 0.25);
}
.nums { display: flex; gap: 10px; color: var(--muted); font-size: 10px; }
.manage {
  width: 100%; padding: 6px;
  border-radius: 7px; font-size: 10px; font-weight: 600;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.15s;
}
.manage:hover { background: var(--blue); border-color: var(--blue); color: #fff; }

/* Websites */
.ws-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px;
}
.ws-card {
  padding: 14px;
  border-radius: 12px;
  background: var(--surface2);
  border: 1px solid rgba(56, 110, 180, 0.18);
  transition: all 0.2s;
}
.ws-card:hover {
  transform: translateY(-2px);
  border-color: var(--blue);
  box-shadow: 0 8px 24px rgba(59, 138, 255, 0.12);
}
.site-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.site-icon {
  width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center; font-size: 16px;
  background: rgba(59, 138, 255, 0.12);
  flex-shrink: 0;
}
.ws-card b { font-size: 13px; font-weight: 600; }
.url { font-size: 11px; color: var(--blue); word-break: break-all; margin-bottom: 6px; }
.meta { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
.actions { display: flex; gap: 6px; }
.actions a {
  flex: 1; text-align: center; padding: 6px;
  border-radius: 7px; font-size: 11px; font-weight: 600;
  background: var(--surface3);
  border: 1px solid var(--border);
  color: var(--muted);
  transition: all 0.15s;
}
.actions a:hover { color: var(--text); border-color: var(--border-hover); }
.actions a.primary {
  background: linear-gradient(135deg, #3b8aff, #1a6ef0);
  border-color: transparent; color: #fff;
}

/* KPI boxes */
.kpi {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.kpi div {
  text-align: center;
  padding: 14px 10px;
  border-radius: 12px;
  background: var(--surface2);
  border: 1px solid rgba(56, 110, 180, 0.18);
}
.kpi b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
.kpi span { font-size: 11px; color: var(--muted); }
.ok { color: var(--green); }
.err { color: var(--red); }
.warn { color: var(--amber); }

/* Activity list */
.li {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(56, 110, 180, 0.12);
}
.li:last-child { border-bottom: none; }
.dot {
  width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: var(--surface3);
}
.dot.success { color: var(--green); background: rgba(34, 211, 160, 0.1); }
.dot.failure { color: var(--red); background: rgba(255, 107, 129, 0.1); }
.li b { font-size: 12px; font-weight: 600; display: block; }
.li small { font-size: 11px; color: var(--muted); }
.time { margin-left: auto; color: var(--muted2); font-size: 11px; white-space: nowrap; }

/* Logs scroll */
.logs { max-height: 280px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--surface3) transparent; }

/* Trending */
.trend-row {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid rgba(56, 110, 180, 0.12);
  transition: background 0.15s;
}
.trend-row:last-child { border-bottom: none; }
.trend-row:hover { background: rgba(59, 138, 255, 0.04); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 8px; }
.trend-rank {
  width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center;
  font-size: 11px; font-weight: 800;
  background: var(--surface3); color: var(--muted);
}
.trend-rank.top3 { background: rgba(251, 191, 36, 0.12); color: var(--amber); }
.trend-title { min-width: 0; flex: 1; }
.trend-title b {
  display: block; font-size: 12px; font-weight: 600;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.trend-title small { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
.trend-score {
  font-size: 10px; font-weight: 600;
  color: var(--amber);
  background: rgba(251, 191, 36, 0.1);
  border-radius: 12px; padding: 3px 8px;
  white-space: nowrap;
}

/* Quick actions */
.qa a {
  display: flex; justify-content: space-between; align-items: center;
  padding: 11px 14px;
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 13px; font-weight: 600;
  background: linear-gradient(90deg, rgba(20, 50, 100, 0.5), rgba(15, 35, 70, 0.5));
  border: 1px solid rgba(56, 110, 180, 0.25);
  color: #c0d8f5;
  transition: all 0.18s;
}
.qa a:hover {
  background: linear-gradient(90deg, #1a6ef0, #3b8aff);
  border-color: transparent;
  color: #fff;
  transform: translateX(4px);
  box-shadow: 0 4px 16px rgba(59, 138, 255, 0.25);
}
.qa a:last-child { margin-bottom: 0; }

/* System status box */
.okbox {
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 12px; font-weight: 600;
  background: linear-gradient(135deg, rgba(12, 60, 50, 0.4), rgba(8, 35, 35, 0.5));
  border: 1px solid rgba(34, 211, 160, 0.3);
  color: var(--green);
  margin-top: 16px;
}
.okbox.bad {
  background: linear-gradient(135deg, rgba(80, 20, 30, 0.3), rgba(50, 10, 20, 0.4));
  border-color: rgba(255, 107, 129, 0.3);
  color: var(--red);
}

/* Right column stack */
.col-right { display: flex; flex-direction: column; gap: 16px; }

/* Empty state */
.empty { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }
.empty span { font-size: 28px; display: block; margin-bottom: 8px; }

/* ─── RESPONSIVE ─── */
@media (max-width: 1200px) {
  .grid { grid-template-columns: 1fr 1fr; }
  .col-right { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .stats { grid-template-columns: repeat(4, 1fr); }
}
@media (max-width: 940px) {
  .app { grid-template-columns: 180px 1fr; gap: 14px; padding: 14px; }
  .topnav { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .grid { grid-template-columns: 1fr; }
  .col-right { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
  .top { padding: 0 12px; height: 56px; gap: 10px; }
  .burger { display: block; }
  .logo { font-size: 15px; }
  .logo-icon { width: 30px; height: 30px; font-size: 13px; }
  .status-pill { display: none; }
  .app { display: block; padding: 12px; }
  nav {
    position: fixed; inset: 0 25% 0 0; z-index: 60;
    border-radius: 0; padding: 70px 12px 16px;
    transform: translateX(-110%);
    transition: transform 0.25s ease;
    overflow-y: auto;
  }
  nav.open { transform: translateX(0); }
  .stats { grid-template-columns: 1fr 1fr; gap: 10px; }
  .stat { padding: 14px; }
  .stat-ico { width: 40px; height: 40px; font-size: 18px; border-radius: 12px; }
  .stat strong { font-size: 22px; }
  .welcome { flex-direction: column; align-items: flex-start; padding: 16px; }
  .welcome h1 { font-size: 18px; }
  .yt-grid { grid-template-columns: repeat(2, 1fr); }
  .ws-grid { grid-template-columns: 1fr; }
  .btn-top { padding: 6px 10px; font-size: 11px; }
}
@media (max-width: 400px) {
  .stats { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<script src="app.js"></script>
<script>
function clockText() {
  return new Date().toLocaleString('hi-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

boot('index.html', 'YouTube • GitHub • Telegram • All Projects', d => {
  const channels = d.channels || [];
  const sites = d.websites || d.sites || [];
  const bots = d.bots || [];
  const runs = bots.flatMap(b => (b.runs || []).map(r => ({ name: b.name || b.id || 'Automation', r })))
    .sort((a, b) => new Date(b.r.t) - new Date(a.r.t));
  const recent = runs.filter(x => x.r.d >= 60 || x.r.s === 'failure');
  const today = new Date().toLocaleDateString('en-CA');
  const todayRuns = recent.filter(x => new Date(x.r.t).toLocaleDateString('en-CA') === today).length;
  const success = recent.filter(x => x.r.s === 'success').length;
  const failed = recent.filter(x => x.r.s === 'failure').length;
  const messages = (d.telegram || d.messages || []).length;
  const lastJob = runs[0];

  const agoText = t => {
    if (!t) return '—';
    let m = Math.max(0, (Date.now() - new Date(t)) / 60000);
    return m < 1 ? 'अभी' : m < 60 ? Math.round(m) + ' मिनट पहले' : m < 1440 ? Math.round(m / 60) + ' घंटे पहले' : Math.round(m / 1440) + ' दिन पहले';
  };

  const row = x => `<div class="li">
    <span class="dot ${x.r.s}">${x.r.s === 'success' ? '✓' : x.r.s === 'failure' ? '✕' : '…'}</span>
    <div><b>${esc(x.name)}</b><small>${esc(x.r.s || 'unknown')} · ${Math.ceil((+x.r.d || 0) / 60)} मिनट</small></div>
    <span class="time">${agoText(x.r.t)}</span>
  </div>`;

  // ── Top bar ──
  const top = document.querySelector('.top');
  top.innerHTML = `
    <button class="burger" aria-label="Menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button>
    <div class="logo">
      <div class="logo-icon">⚙</div>
      <div>BG Automation<small>Automate · Create · Grow</small></div>
    </div>

// Run Sync via Cloudflare Worker
window.runDashboardSync = async function () {
  const btn = document.getElementById('runSyncBtn');
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = '⏳ Syncing…';
  try {
    const r = await fetch('https://bg-automation-live.garhwalbhavesh2002.workers.dev/api/sync', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    btn.textContent = '✓ Synced!';
    setTimeout(() => { window.refreshDashboard && window.refreshDashboard(); }, 2000);
  } catch (e) {
    btn.textContent = '⚠ Failed';
    console.warn('Sync failed:', e.message || e);
  } finally {
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '▶ Run Sync';
    }, 3000);
  }
};

setInterval(() => {
  const el = document.querySelector('#clock');
  if (el) el.textContent = clockText();
}, 30000);
</script>
<script>
(async function loadDashboardTrending() {
  let box = document.querySelector('#dashTrending');
  if (!box) {
    await new Promise(resolve => {
      const observer = new MutationObserver(() => {
        box = document.querySelector('#dashTrending');
        if (box) { observer.disconnect(); resolve(); }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      setTimeout(() => { observer.disconnect(); resolve(); }, 15000);
    });
  }
  if (!box) return;
  const url = 'https://raw.githubusercontent.com/bgtechlab/Trending-Topic-Finder/main/history.json';
  try {
    const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json(), rows = [];
    Object.entries(data || {}).forEach(([channel, group]) => {
      if (!group) return;
      const list = Array.isArray(group.latest) ? group.latest : (Array.isArray(group.suggested) ? group.suggested : []);
      list.forEach(t => rows.push({ ...t, channel, updated_at: t.fetched_at || group.updated_at || '' }));
    });
    const seen = new Set();
    const top = rows.filter(t => t && t.title).filter(t => {
      const k = String(t.title).trim().toLowerCase();
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    }).sort((a, b) => new Date(b.updated_at || 0) - new Date(a.updated_at || 0)).slice(0, 8);

    box.innerHTML = top.length
      ? '<small style="color:var(--muted);font-size:11px;display:block;margin-bottom:8px">Latest · ' +
        esc(top[0].updated_at ? new Date(top[0].updated_at).toLocaleString('hi-IN') : '—') + '</small>' +
        top.map((t, i) => {
          const title = esc(t.title);
          const score = Number.isFinite(+t.score) ? Math.round(+t.score) : '—';
          const source = esc(t.source || 'unknown');
          const link = esc(t.url || '#');
          return `<a href="${link}" target="_blank" rel="noopener" class="trend-row">
            <span class="trend-rank ${i < 3 ? 'top3' : ''}">${i + 1}</span>
            <span class="trend-title"><b>${title}</b><small>${source} · ${esc(t.channel || '')}</small></span>
            <span class="trend-score">Score ${score}</span>
          </a>`;
        }).join('')
      : '<div class="empty"><span>🔥</span>No trending data yet</div>';
  } catch (e) {
    box.innerHTML = '<div class="empty"><span>📡</span>Trending unavailable. <a href="trending.html" style="color:var(--blue)">Open page →</a></div>';
  }
})();
</script>
