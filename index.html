<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BG Automation | Dashboard</title>
<style>
:root{--bg:#071126;--panel:#0b1934;--panel2:#0e2042;--line:#203963;--text:#e6edff;--muted:#91a5c9;--blue:#1685ee;--green:#00d6a0}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#071126,#06132b);color:var(--text);font:12px/1.45 system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif}
a{color:inherit;text-decoration:none}.top,nav{display:none!important}.app{display:block!important;max-width:1600px;margin:auto;padding:15px}.app main{min-width:0}
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 248px;grid-template-areas:"stats stats quick" "youtube websites logs" "automation activity telegram";gap:13px;align-items:start}
.stats{grid-area:stats;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stat,.card{background:linear-gradient(145deg,#0c1b38,#091731);border:1px solid #1d3764;border-radius:9px;box-shadow:0 5px 15px #02081735;min-width:0}
.stat{padding:12px 14px;display:grid;grid-template-columns:40px 1fr;gap:2px 10px;align-items:center;min-height:78px}
.ico{grid-row:span 2;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:19px;background:#17366a}.stat small{font-size:11px;color:#c6d4ef}.stat strong{font-size:23px;line-height:1.2;font-weight:750}.sub{grid-column:1/-1;color:var(--muted);font-size:10px;margin-top:2px;display:flex;justify-content:space-between}
.card{padding:12px 13px}.hd{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:7px}.hd h2{font-size:13px;margin:0;font-weight:700}.hd a{color:#3ca4ff;font-size:10px;white-space:nowrap}.col{display:grid;gap:13px;min-width:0}.dash > section:nth-of-type(2){grid-area:youtube}.dash > section:nth-of-type(3){grid-area:websites}.dash > section:nth-of-type(4){grid-area:automation}.dash > section:nth-of-type(5){grid-area:activity}.rightcol{display:contents}.rightcol>.card:nth-child(1){grid-area:quick}.rightcol>.card:nth-child(2){grid-area:logs}.rightcol>.card:nth-child(3){grid-area:telegram}
.item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid #1a3155;min-width:0}.item:last-child{border-bottom:0}.symbol{width:32px;height:32px;flex:0 0 32px;border-radius:9px;background:#143568;display:grid;place-items:center;font-size:16px}.item-main{min-width:0;flex:1}.item-main b{display:block;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item-main small{display:block;color:var(--muted);font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.right{margin-left:auto;text-align:right;flex-shrink:0}.pill{display:inline-block;border-radius:12px;padding:2px 7px;background:#073b36;color:#22e0b0;font-size:9px}.pill.bad{background:#411b27;color:#ff8092}.count{font-size:9px;color:var(--muted);margin-top:3px}
.qa a{display:flex;align-items:center;gap:8px;background:#10264e;border:1px solid #1f3b6a;border-radius:7px;padding:7px 8px;margin:6px 0;font-size:10px}.qa a:hover{background:#173568}.qa .symbol{width:31px;height:31px;flex-basis:31px}.arrow{margin-left:auto;color:#8bbfff;font-size:16px}
.logline{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1a3155;min-width:0}.logline:last-child{border:0}.logtime{color:#8ea1c5;font-size:9px;white-space:nowrap}.tag{font-size:9px;font-weight:700;padding:1px 4px;border-radius:3px;background:#073a34;color:#2be2ad;white-space:nowrap}.tag.info{background:#0d2e57;color:#65baff}.tag.fail{background:#421d27;color:#ff8295}.logtext{font-size:9.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.foot{text-align:right;margin-top:6px;font-size:9px;color:#4baaff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}.kpi{text-align:center;padding:5px 4px;border-right:1px solid #24406b}.kpi:last-child{border:0}.kpi .symbol{margin:0 auto 7px}.kpi b{display:block;font-size:14px}.kpi small{color:var(--muted);font-size:9px}.bar{height:6px;background:#122b50;border-radius:9px;margin:8px 0 3px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:#00cfa2;border-radius:9px}.kpi:nth-child(2) .bar i{background:#6d4cff}.kpi:nth-child(4) .bar i{background:#ffb52d}
.activity .item{padding:6px 0}.activity .symbol{width:29px;height:29px;flex-basis:29px}.live{color:#00e1a8;font-size:9px}.live:before{content:"";display:inline-block;width:6px;height:6px;background:#00d6a0;border-radius:50%;margin-right:5px}
@media(max-width:850px){.dash{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"stats stats" "youtube websites" "automation activity" "quick quick" "logs telegram"}.rightcol{display:contents}}
@media(max-width:540px){.app{padding:9px}.dash{grid-template-columns:1fr;grid-template-areas:"stats" "youtube" "websites" "automation" "activity" "quick" "logs" "telegram";gap:10px}.stats{gap:7px}.stat{padding:9px;grid-template-columns:32px 1fr;gap:2px 7px;min-height:70px}.ico{width:31px;height:31px;font-size:16px}.stat strong{font-size:19px}.stat small{font-size:10px}.rightcol{grid-column:1;grid-template-columns:1fr}.card{padding:11px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<script src="app.js"></script>
<script>
function clockText(){return new Date().toLocaleString('hi-IN',{hour:'2-digit',minute:'2-digit'})}
boot('index.html','Dashboard',d=>{
 const channels=d.channels||[],sites=d.websites||d.sites||[],bots=d.bots||[],messages=d.telegram||d.messages||[];
 const runs=bots.flatMap(b=>(b.runs||[]).map(r=>({name:b.name||b.id||b.repo||'Automation',r}))).sort((a,b)=>new Date(b.r.t||0)-new Date(a.r.t||0));
 const successful=runs.filter(x=>x.r.s==='success').length,failed=runs.filter(x=>x.r.s==='failure').length;
 const ago=t=>{if(!t)return'—';const m=Math.max(0,(Date.now()-new Date(t))/60000);return m<1?'अभी':m<60?Math.round(m)+' मिनट पहले':m<1440?Math.round(m/60)+' घंटे पहले':Math.round(m/1440)+' दिन पहले'};
 const status=s=>s==='success'?['Success','']:s==='failure'?['Failed','bad']:s==='in_progress'?['Running','']:s==='queued'?['Queued','']:['Active',''];
 const ch=c=>{const n=c.name||c.title||c.id||'YouTube Channel';return '<div class="item"><span class="symbol" style="background:#9e183b;color:#fff">▶</span><div class="item-main"><b>'+esc(n)+'</b><small>'+esc(c.description||c.category||c.id||'YouTube Automation')+'</small></div><div class="right"><span class="pill '+(c.error?'bad':'')+'">'+(c.error?'Error':'Active')+'</span><div class="count">'+fmt(c.subs??c.subscribers??c.viewCount??0)+' subs</div></div></div>'};
 const site=x=>'<div class="item"><span class="symbol">🌐</span><div class="item-main"><b>'+esc(x.name||x.title||'Website / Project')+'</b><small>'+esc(x.url||x.link||'Website project')+'</small></div><div class="right"><span class="pill">'+(x.status==='active'?'Active':'Live')+'</span></div></div>';
 const activity=x=>{const [s,cl]=status(x.r.s);return '<div class="item"><span class="symbol">'+(x.r.s==='failure'?'✕':x.name.toLowerCase().includes('telegram')?'➤':'▶')+'</span><div class="item-main"><b>'+esc(x.name)+'</b><small>'+esc(x.r.message||(x.r.s==='success'?'Job updated successfully':s))+'</small></div><div class="right"><div class="count">'+ago(x.r.t)+'</div></div><span class="arrow">›</span></div>'};
 const log=x=>'<div class="logline"><span class="logtime">'+(x.r.t?new Date(x.r.t).toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'}):'—')+'</span><span class="tag '+(x.r.s==='failure'?'fail':'info')+'">['+(x.r.s==='failure'?'ERROR':x.r.s==='success'?'SUCCESS':'INFO')+']</span><span class="logtext">'+esc(x.name+' · '+(x.r.message||x.r.s||'Status updated'))+'</span></div>';
 document.querySelector('#main').innerHTML='<div class="dash">'+
 '<section class="stats"><div class="stat"><span class="ico" style="background:#a51c45;color:#fff">▶</span><div><small>Total Channels</small><strong>'+channels.length+'</strong></div><div class="sub"><span>YouTube Automation</span><span class="live">'+channels.length+' total</span></div></div>'+
 '<div class="stat"><span class="ico" style="background:#6229c9;color:#fff">⚙</span><div><small>Total Runs</small><strong>'+runs.length+'</strong></div><div class="sub"><span>Automation Jobs</span><span class="live">'+successful+' success</span></div></div>'+
 '<div class="stat"><span class="ico" style="background:#078ec9;color:#fff">➤</span><div><small>Telegram Messages</small><strong>'+messages.length+'</strong></div><div class="sub"><span>Available messages</span><span class="live">Live data</span></div></div></section>'+
 '<section class="card"><div class="hd"><h2>▶ YouTube Channels</h2><a href="youtube.html">View All →</a></div>'+channels.slice(0,6).map(ch).join('')+'</section>'+
 '<section class="card"><div class="hd"><h2>🌐 Websites / Projects</h2><a href="sites.html">View All →</a></div>'+sites.slice(0,6).map(site).join('')+'</section>'+
 '<div class="col rightcol"><section class="card qa"><div class="hd"><h2>⚡ Quick Actions</h2></div><a href="youtube.html"><span class="symbol" style="background:#a51c45">▶</span>Upload YouTube Video<span class="arrow">›</span></a><a href="https://github.com/bgsarkariresult/BG-Automation" target="_blank" rel="noopener"><span class="symbol">◉</span>View GitHub Repository<span class="arrow">›</span></a><a href="logs.html"><span class="symbol" style="background:#078ec9">➤</span>Send Telegram Message<span class="arrow">›</span></a><a href="sites.html"><span class="symbol" style="background:#6229c9">▦</span>Check All Projects<span class="arrow">›</span></a></section>'+
 '<section class="card"><div class="hd"><h2>⌁ Live Logs</h2><span class="live">Live</span></div>'+(runs.slice(0,5).map(log).join('')||'<small>No logs available.</small>')+'<div class="foot"><a href="logs.html">View All Logs →</a></div></section>'+
 '<section class="card"><div class="hd"><h2>➤ Recent Telegram Messages</h2><a href="logs.html">View All →</a></div>'+(messages.slice(0,4).map(m=>'<div class="item"><span class="symbol" style="background:#078ec9">➤</span><div class="item-main"><b>'+esc(m.title||m.name||m.text||'Telegram update')+'</b><small>'+esc(m.message||m.status||'')+'</small></div><div class="right count">'+ago(m.time||m.updated||m.t)+'</div></div>').join('')||'<small>No Telegram messages available.</small>')+'</section></div>'+
 '<section class="card"><div class="hd"><h2>⚙ Automation Overview</h2><a href="control.html">View Details →</a></div><div class="kpis"><div class="kpi"><span class="symbol">▶</span><b>'+channels.length+'</b><small>YouTube</small><div class="bar"><i></i></div></div><div class="kpi"><span class="symbol">🌐</span><b>'+sites.length+'</b><small>Websites</small><div class="bar"><i></i></div></div><div class="kpi"><span class="symbol">➤</span><b>'+messages.length+'</b><small>Telegram</small><div class="bar"><i></i></div></div><div class="kpi"><span class="symbol">◉</span><b>'+bots.length+'</b><small>GitHub</small><div class="bar"><i></i></div></div></div></section>'+
 '<section class="card activity"><div class="hd"><h2>🕒 Recent Activity</h2><a href="logs.html">View All →</a></div>'+(runs.slice(0,4).map(activity).join('')||'<small>No recent activity.</small>')+'</section>'+
 '</div>';
});
</script>
</body>
</html>
