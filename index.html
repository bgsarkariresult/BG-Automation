<script>
const WORKER_URL='https://bg-runf.garhwalbhavesh2002.workers.dev/';
function nowS(){return new Date().toLocaleString('hi-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function runNow(btn){btn.disabled=true;btn.textContent='⏳ Chalu ho raha hai...';fetch(WORKER_URL,{method:'POST'}).then(r=>r.json()).then(j=>{btn.textContent=j.ok?'✅ Run shuru ho gaya':'❌ '+(j.error||'Fail')}).catch(()=>btn.textContent='❌ Network error').finally(()=>setTimeout(()=>{btn.disabled=false;btn.textContent='▶ Abhi Run Karo'},6000))}
boot('index.html','YouTube • GitHub • Telegram • All Projects',d=>{
 const chs=d.channels||[],sites=d.sites||d.websites||[],bots=d.bots||[];
 const T=TD(),s=stats(d,T,T),tgCount=(d.telegram&&d.telegram.length)||(d.messages&&d.messages.length)||0;
 const dayAgo=Date.now()-864e5;
 const runs24=bots.reduce((n,b)=>n+(b.runs||[]).filter(r=>new Date(r.t)>dayAgo&&(r.d>=60||r.s==='failure')).length,0);
 const last=[...bots].filter(b=>b.time).sort((a,b)=>new Date(b.time)-new Date(a.time))[0];
 const fail=bots.filter(b=>b.status==='failure').length;
 const tm=t=>new Date(t).toLocaleTimeString('hi-IN',{hour:'2-digit',minute:'2-digit'});
 const ev=bots.flatMap(b=>(b.runs||[]).filter(r=>r.d>=60||r.s==='failure').map(r=>({n:b.name,r}))).sort((a,b)=>new Date(b.r.t)-new Date(a.r.t));
 const li=(e,showTime)=>`<div class="li"><span class="dot s-${e.r.s}">${e.r.s==='success'?'✔':e.r.s==='failure'?'✖':'⏳'}</span><div><b>${esc(e.n)}</b><small style="display:block;color:var(--mu)">${esc(e.r.s)} • ${Math.ceil(e.r.d/60)} min</small></div><span class="t">${showTime?tm(e.r.t):ago(e.r.t)}</span></div>`;
 const top=document.querySelector('.top');
 if(top)top.innerHTML=`<button class="burger" aria-label="Menu" onclick="document.querySelector('nav').classList.toggle('open')">☰</button><div class="logo"><span style="color:#20baff">⚙ BG</span> Automation<small>Automate　•　Create　•　Grow</small></div><div class="topnav"><a class="on" href="index.html">⌂　Home</a><a href="youtube.html">▶　YouTube</a><a href="https://github.com/bgsarkariresult/BG-Automation" target="_blank" rel="noopener">◉　GitHub</a><a href="logs.html">➤　Telegram</a><a href="sites.html">▦　All Projects</a></div><div class="topright"><div class="status"><b>System Online</b><span id="clk">${nowS()}</span></div><div class="avatar">BG</div></div>`;
 const nav=document.querySelector('nav');
 if(nav)nav.innerHTML=`<a class="on" href="index.html">⌂　Dashboard</a><a href="youtube.html">▶　YouTube Channels <span class="cnt">${chs.length}</span></a><a href="sites.html">▣　Websites / Projects</a><a href="control.html">⚙　Automation</a><a href="logs.html">▤　Activity Logs</a><a href="logs.html">➤　Telegram Messages <span class="cnt">${tgCount}</span></a><a href="https://github.com/bgsarkariresult/BG-Automation/settings/secrets/actions" target="_blank" rel="noopener">⚙　Settings</a><div class="sys"><b>● System Online</b><br><small id="sysS">Last updated: ${at(d.updated)}</small></div>`;
 const chC=c=>{const nm=c.name||c.title||c.id||'Channel',ic=c.icon||c.thumb||c.thumbnail||c.img||'',av=/^https?:/.test(ic)?`<img src="${esc(ic)}" alt="">`:`<div class="av">${esc(String(nm).slice(0,2).toUpperCase())}</div>`;return `<div class="yt-card">${av}<b>${esc(nm)}</b><div class="id">${esc((c.id||'—').slice(0,13))}</div><span class="chip ${c.error?'e':''}">${c.error?'Error':'● Active'}</span><div class="nums"><span>👁 ${fmt(c.views??c.viewCount)}</span><span>👥 ${fmt(c.subs??c.subscribers)}</span></div><a class="manage" href="youtube.html">Manage</a></div>`};
 const stC=x=>{const u=x.url||x.link||'',articles=(x.days||{})[T]||0,colors=['#e11d48','#2563eb','#7c3aed','#0891b2','#d97706'],col=colors[(x.name||'').length%colors.length];return `<div class="ws-card"><div class="top"><div class="icon" style="background:${col}22;color:${col}">🌐</div><div><b>${esc(x.name||x.title||'Site')}</b>${x.tag?`<div class="tag">${esc(x.tag)}</div>`:''}</div></div>${u?`<div class="url">${esc(u)}</div>`:''}<div class="meta"><span>📰 Articles: ${articles}</span><span>Last: ${ago(x.updated||d.updated)}</span></div><div class="actions"><a href="sites.html">Manage</a>${u?`<a class="primary" href="${esc(u)}" target="_blank" rel="noopener">View Site ↗</a>`:''}</div></div>`};
 $('#main').innerHTML=`<div class="dg"><div>
 <div class="card wel"><div><h2>👋 <span>Welcome Back,</span> Bhavesh!</h2><p>Your YouTube, Websites and Automation are running smoothly.</p><small>Keep creating, keep growing. 🚀</small></div><div class="dt"><span id="clock2">${nowS()}</span><span class="lv">Live</span></div></div>
 <div class="stats4"><div class="stat4"><div class="ico" style="background:#e11d4825;color:#fb7185">▶</div><div><small>Total Channels</small><b>${chs.length}</b></div><div class="sub">YouTube Automation</div></div><div class="stat4"><div class="ico" style="background:#7c3aed25;color:#b69aff">⚙</div><div><small>Total Runs</small><b>${runs24}</b></div><div class="sub">Automation jobs · last 24h</div></div><div class="stat4"><div class="ico" style="background:#0891b225;color:#38bdf8">➤</div><div><small>Telegram Messages</small><b>${tgCount||'—'}</b></div><div class="sub">Available messages</div></div></div>
 <div class="card"><div class="hd"><h2>▶ YouTube Channels</h2><a class="btn" href="youtube.html">View All →</a></div><div class="yt-grid">${chs.slice(0,8).map(chC).join('')||'<small>No channel found.</small>'}<a class="yt-card yt-add" href="youtube.html"><div class="plus">＋</div><b>Add New Channel</b><small>Add another channel</small></a></div></div>
 <div class="card"><div class="hd"><h2>🌐 Websites / Projects</h2><a class="btn g" href="sites.html">View All →</a></div><div class="ws-grid">${sites.slice(0,6).map(stC).join('')||'<small>No website found.</small>'}</div></div>
 <div class="three"><div class="card"><div class="hd"><h2>⚙ Automation Overview</h2><a class="btn g" href="control.html">Details →</a></div><div class="k"><div><small>Total Jobs</small><b>${s.ok+s.bad}</b></div><div class="ok"><small>Success</small><b>${s.ok}</b></div><div class="er"><small>Failed</small><b>${s.bad}</b></div><div class="wa"><small>Running</small><b>${bots.filter(b=>['in_progress','queued'].includes(b.status)).length}</b></div></div><small>Last job: ${last?ago(last.time):'No recent job'}</small></div><div class="card"><div class="hd"><h2>🕒 Recent Activity</h2><a class="btn g" href="logs.html">View All →</a></div>${ev.slice(0,5).map(e=>li(e,0)).join('')||'<small>No recent activity.</small>'}</div></div>
 </div><div><div class="card qa"><div class="hd"><h2>⚡ Quick Actions</h2></div><a href="youtube.html"><span>▶　Upload YouTube Video</span><span>›</span></a><a href="https://github.com/bgsarkariresult/BG-Automation" target="_blank" rel="noopener"><span>◉　View GitHub Repository</span><span>›</span></a><a href="logs.html"><span>➤　Send Telegram Message</span><span>›</span></a><a href="sites.html"><span>▦　Check All Projects</span><span>›</span></a><a href="control.html" onclick="return true"><span>⚙　Automation Control</span><span>›</span></a></div>
 <div class="card"><div class="hd"><h2>⌁　Live Logs</h2><span class="lv">Live</span></div><div class="logs">${ev.slice(0,8).map(e=>li(e,1)).join('')||'<small>No logs available.</small>'}</div><div style="text-align:right;margin-top:8px"><a class="btn g" href="logs.html">View All Logs →</a></div></div>
 <div class="card"><div class="hd"><h2>➤ Recent Activity</h2><a class="btn g" href="logs.html">View All →</a></div>${ev.slice(0,4).map(e=>li(e,0)).join('')||'<small>No recent activity.</small>'}</div>
 <div class="ok-box ${fail?'bad':''}">${fail?'⚠ '+fail+' project(s) failed':'✔ All Systems Running'}<small style="display:block;font-weight:500;opacity:.8;margin-top:3px">GitHub Actions • YouTube • Telegram • Websites</small></div>
 </div></div>`;
});
setInterval(()=>{const a=document.querySelector('#clk'),b=document.querySelector('#clock2');if(a)a.textContent=nowS();if(b)b.textContent=nowS()},30000);
</script>
</body>
</html>
'''
path = Path("/mnt/data/index.html")
path.write_text(html, encoding="utf-8")
print(f"Created {path} ({path.stat().st_size} bytes)")
