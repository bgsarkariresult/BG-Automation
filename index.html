<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BG Automation | Dashboard</title>
  <meta name="theme-color" content="#3b5bff">
  <meta name="description" content="BG Automation live dashboard">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="app.css">
  <style>
    body{margin:0;background:#070d1f;color:#eef4ff;font-family:Inter,system-ui,sans-serif}
    #boot-msg{padding:40px 24px;text-align:center;color:#8ba3c7}
  </style>
</head>
<body>
  <div id="boot-msg">⏳ Dashboard load ho raha hai…</div>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function (e) {
          console.warn("BG Automation service worker:", e);
        });
      });
    }
  </script>
</body>
</html>
