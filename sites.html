<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Website & Articles | BG Automation</title><link rel="stylesheet" href="app.css"></head><body><script src="app.js?v=20261008"></script>
<script>
boot('sites.html','Website & Article Monitor',d=>{
 const T=TD(),wk=[...Array(7)].map((_,i)=>dayOf(Date.now()-i*864e5));
 const sites=d.sites||[],websites=d.websites||[];
 const bots=d.bots||[];
 const byRepo=new Map(bots.map(b=>[String(b.repo||'').toLowerCase(),b]));
 const cards=websites.map(w=>{
   const s=sites.find(x=>String(x.url||'').replace(/\/$/,'').toLowerCase()===String(w.url||'').replace(/\/$/,'').toLowerCase())||{};
   const b=byRepo.get(String(w.repo||'').toLowerCase());
   const days=s.days||{},td=days[T]||0,count=wk.reduce((n,x)=>n+(days[x]||0),0);
   const latest=(b?.runs||[]).slice().sort((a,c)=>new Date(c.t)-new Date(a.t))[0];
   const state=b?.status||latest?.s||'unknown';
   const status=state==='success'?'success':state==='in_progress'||state==='queued'?'running':state==='failure'?'failure':'unknown';
   const label=status==='success'?'✔ Success':status==='running'?'⏳ Running':status==='failure'?'✖ Failed':'● Unknown';
   return '<section class="card"><div class="hd"><div><h2>'+esc(w.name||'Website')+'</h2><small>'+esc(w.tag||'Website')+'</small></div><a class="btn g" href="'+esc(w.url||'#')+'" target="_blank" rel="noopener">Site kholo ↗</a></div>'+
   '<div class="k"><div><small>Articles (saved)</small><b>'+(s.total??'—')+'</b></div><div><small>Aaj naye</small><b>'+td+'</b></div><div><small>7 din</small><b>'+count+'</b></div><div><small>GitHub Actions</small><b style="font-size:1rem" class="'+(status==='success'?'ok':status==='failure'?'err':'warn')+'">'+label+'</b></div></div>'+
   '<p><small>Latest automation: '+esc(latest?.t?at(latest.t):'अभी उपलब्ध नहीं')+(latest?.number?' · Run #'+esc(latest.number):'')+'</small></p>'+
   (latest?.u?'<a class="btn alt" href="'+esc(latest.u)+'" target="_blank" rel="noopener">Latest Actions Run देखें ↗</a>':'')+
   (s.articles?.length?'<div style="margin-top:10px"><b>हाल के लेख</b>'+s.articles.slice(0,10).map(a=>'<a class="vid" href="'+esc(a.u)+'" target="_blank" rel="noopener">'+esc(a.t)+'<br><small>'+esc(a.d||'तारीख उपलब्ध नहीं')+'</small></a>').join('')+'</div>':'')+'</section>';
 }).join('');
 $('#main').innerHTML='<div class="card"><div class="hd"><h2>🌐 Websites & Live Automation</h2><span class="chip">Auto refresh · 15 sec</span></div><p><small>Website की जानकारी dashboard data से और automation की स्थिति Cloudflare Live GitHub Actions API से ली जाती है।</small></p><div class="k"><div><small>Total Websites</small><b>'+websites.length+'</b></div><div><small>Live Bots</small><b>'+bots.length+'</b></div><div><small>Live API</small><b class="'+(d.live_state==='live'?'ok':'warn')+'">'+(d.live_state==='live'?'Connected':'Fallback')+'</b></div><div><small>Last update</small><b style="font-size:1rem">'+esc(at(d.live_updated||d.updated))+'</b></div></div></div>'+ (cards||'<div class="card">Dashboard में websites उपलब्ध नहीं हैं।</div>')+'<div class="card"><small>नोट: Articles और कुल संख्या पिछली dashboard sync के अनुसार हैं। GitHub Actions का status Live API से अपडेट होता है।</small></div>';
});
</script></body></html>
